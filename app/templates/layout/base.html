<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "Dashboard Hospitalario" }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bienvenida.css') }}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <link rel="shortcut icon" href="{{ url_for('static', filename='salud_favicon.ico') }}">

    <!-- 🟢 ESTILOS RESPONSIVOS PARA EL MENÚ LATERAL -->
    <style>
        /* CABECERA PARA MÓVILES */
        .mobile-header-toggle {
            display: none;
            background-color: #1e293b;
            color: #ffffff;
            padding: 10px 15px;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1040;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* COMPORTAMIENTO DEL SIDEBAR EN PANTALLAS PEQUEÑAS (<768px) */
        @media (max-width: 768px) {
            .mobile-header-toggle {
                display: flex !important;
            }

            /* 1. Capa Oscura de Fondo */
            .sidebar-overlay-backdrop {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                background-color: rgba(0, 0, 0, 0.6) !important;
                backdrop-filter: blur(2px) !important;
                z-index: 9998 !important;
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.3s ease, visibility 0.3s ease;
            }

            .sidebar-overlay-backdrop.active {
                opacity: 1 !important;
                visibility: visible !important;
            }

            /* 2. Menú Lateral Oculto */
            #sidebar {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 300px !important;
                height: 100vh !important;
                max-width: 85vw !important;
                z-index: 99999 !important;
                background-color: #1e293b !important;
                display: block !important;
                visibility: hidden !important;
                opacity: 0 !important;
                transform: translateX(-100%) !important;
                transition: transform 0.3s ease, opacity 0.3s ease, visibility 0.3s ease !important;
                box-shadow: 5px 0 25px rgba(0, 0, 0, 0.7) !important;
                overflow-y: auto !important;
                overflow-x: visible !important;
                /* 🟢 Permite desplegar popovers */
            }

            /* 3. Menú Lateral Activo */
            #sidebar.show-sidebar {
                visibility: visible !important;
                opacity: 1 !important;
                transform: translateX(0) !important;
            }

            /* 🟢 4. CORRECCIÓN PARA POPOVERS Y DESPLEGABLES DENTRO DEL SIDEBAR MÓVIL */
            #sidebar .popover-unidades,
            #sidebar .popover-list,
            #sidebar select {
                z-index: 100000 !important;
                /* Capa por encima del propio contenedor */
                position: relative;
            }
        }
    </style>
</head>

<body data-login="{{ 'true' if mostrar_login else 'false' }}">

    <!-- 🟢 CABECERA SUPERIOR SOLO EN MÓVILES / PANTALLAS PEQUEÑAS -->
    <div class="mobile-header-toggle">
        <button type="button" id="btnToggleSidebar"
            class="btn btn-outline-light btn-sm d-flex align-items-center gap-2">
            <i class="bi bi-list fs-5"></i>
            <span class="fw-bold">Menú / Filtros</span>
        </button>
        <span class="fw-bold text-truncate ms-2" style="font-size: 0.9rem;">
            {{ title if title else "Dashboard Hospitalario" }}
        </span>
    </div>

    <!-- INCLUSIÓN DE TU MENÚ ORIGINAL (SIN MODIFICAR SU ESTRUCTURA INTERNA) -->
    {% include 'layout/menu.html' %}

    <div id="page-wrapper">

        <div id="barra-filtros">
            {% block barra_filtros %}{% endblock %}
        </div>

        <main id="main-content">
            {% block content %}{% endblock %}
        </main>

        <!-- FOOTER GLOBAL -->
        <footer class="footer-global" id="footer">
            <img src="/static/img/pie_1.png" alt="Gobierno del Estado">

            <svg class="ecg-line" viewBox="0 0 1200 100" preserveAspectRatio="none">
                <path
                    d="M0 50 L150 50 L170 50 L190 20 L210 80 L230 5 L250 95 L270 50 L400 50 L420 50 L440 25 L460 75 L480 50 L1200 50" />
            </svg>
        </footer>

    </div>

    <!-- LÓGICA DE CONTROL DEL FOOTER Y MENÚ LATERAL -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const btnToggle = document.getElementById("btnToggleSidebar");
            const sidebar = document.getElementById("sidebar");

            if (!sidebar) return;

            // Crear el overlay si no existe
            let overlay = document.querySelector(".sidebar-overlay-backdrop");
            if (!overlay) {
                overlay = document.createElement("div");
                overlay.className = "sidebar-overlay-backdrop";
                document.body.appendChild(overlay);
            }

            // Función auxiliar para cerrar el menú
            function cerrarSidebar() {
                if (window.innerWidth <= 768) {
                    sidebar.classList.remove("show-sidebar");
                    overlay.classList.remove("active");
                }
            }

            // Abrir / Cerrar mediante el botón principal
            if (btnToggle) {
                btnToggle.addEventListener("click", function (e) {
                    e.stopPropagation();
                    sidebar.classList.toggle("show-sidebar");
                    overlay.classList.toggle("active");
                });
            }

            // Cerrar menú al presionar la capa oscura de fondo
            overlay.addEventListener("click", cerrarSidebar);

            // Cerrar menú al presionar la tecla Escape
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape" && sidebar.classList.contains("show-sidebar")) {
                    cerrarSidebar();
                }
            });

            // 🟢 CERRAR AUTOMÁTICAMENTE EL MENÚ AL APLICAR FILTROS EN CUALQUIER SUBSISTEMA
            // Detecta botones con la clase .btn-apply o cuyos IDs comiencen por 'btnFiltrar'
            const botonesFiltro = document.querySelectorAll('.btn-apply, [id^="btnFiltrar"]');
            botonesFiltro.forEach(function (btn) {
                btn.addEventListener("click", function () {
                    // Un pequeño retardo para asegurar que el evento de filtrado se dispare
                    setTimeout(cerrarSidebar, 150);
                });
            });
        });
    </script>

</body>

</html>
