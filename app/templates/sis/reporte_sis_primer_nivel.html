{% extends "layout/base.html" %}
{% block content %}
<div class="main-content">
    <div class="container-fluid mt-4 ps-4 pe-4">

        <h2 class="mb-3" id="sis-title">
            🏥 SIS - Primer Nivel
            <span id="sis-meta" style="font-size: 18px;" data-control='{{ control_anual | tojson | safe }}'>
            </span>
        </h2>

        <!-- =================================================================== -->
        <!-- 🔹 NUEVO: CONTENEDORES DE FILTROS DINÁMICOS                         -->
        <!-- =================================================================== -->
        <div class="card mb-4">
            <div class="card-header font-weight-bold bg-light">Filtros</div>
            <div class="card-body">
                <div class="row">
                    <!-- Contenedor donde JS inyectará los Checkboxes de Jurisdicción -->
                    <div class="col-md-6 mb-2">
                        <label class="form-label font-weight-bold">Jurisdicción:</label>
                        <div id="contenedorFiltroJurisdiccion" class="border p-2 rounded"
                            style="max-height: 120px; overflow-y: auto;">
                        </div>
                    </div>

                    <!-- Contenedor donde JS inyectará los Checkboxes de Municipio -->
                    <div class="col-md-6 mb-2">
                        <label class="form-label font-weight-bold">Municipio:</label>
                        <div id="contenedorFiltroMunicipio" class="border p-2 rounded"
                            style="max-height: 120px; overflow-y: auto;">
                        </div>
                    </div>
                </div>
                <!-- Botón opcional de filtrado explícito (tu JS ya lo busca con "btnFiltrarSis") -->
                <button type="button" id="btnFiltrarSis" class="btn btn-primary btn-sm mt-2">Aplicar Filtros</button>
            </div>
        </div>

        <!-- GRÁFICAS SUPERIORES -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body text-center">
                        <h6 class="text-muted mb-2">Total Consultas</h6>
                        <canvas id="graficaSisPorAnio"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-body text-center">
                        <h6 class="text-muted mb-2" id="tituloGraficaSis">Estudios de Gabinete</h6>
                        <canvas id="graficaSis"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="card">
            <div class="card-body">
                <!-- 🔹 PESTAÑAS POR AÑO -->
                <ul class="nav nav-tabs mb-3" id="tabsAnios"></ul>
                <div class="table-responsive">
                    <table class="table table-striped table-sm" id="tablaResultados">
                        <thead>
                            <tr>
                                <th class="text-center">Año</th>
                                <th>CLUES</th>
                                <th>Unidad</th>
                                <th class="text-center">Consultas</th>
                                <th class="text-center">Embarazadas</th>
                                <th class="text-center">Salud Mental</th>
                                <th class="text-center">Salud Bucal</th>
                                <th class="text-center">Tamiz</th>
                                <th class="text-center">Planificación Fam.</th>
                                <th class="text-center">Detecciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaSIS"></tbody>
                    </table>
                </div>
                <!-- 🔹 PAGINACIÓN -->
                <nav class="mt-2">
                    <ul class="pagination pagination-sm" id="paginacionTabla"></ul>
                </nav>

                <!-- ===================================================
                     GRAFICA MENSUAL SIS
                ==================================================== -->
                <hr>
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                            <h5 class="mb-0">📈 Total SIS mensual</h5>

                            <div class="d-flex gap-2 align-items-center">
                                <!-- 🔹 OPCIONES AGREGADAS AL SELECT -->
                                <select id="filtroSisDetalle" class="form-select form-select-sm w-auto">
                                    <option value="consultas">Consultas</option>
                                    <option value="embarazadas">Embarazadas</option>
                                    <option value="mental">Salud Mental</option>
                                    <option value="bucal">Salud Bucal</option>
                                    <option value="tamiz">Tamiz</option>
                                    <option value="planificacion_familiar">Planificación Familiar</option>
                                    <option value="detecciones">Detecciones</option>
                                </select>

                                <!-- BOTÓN DE MOSTRAR / OCULTAR VALORES -->
                                <button type="button" class="btn btn-outline-primary btn-sm"
                                    id="btnToggleValoresMensual">
                                    Mostrar valores
                                </button>
                            </div>
                        </div>

                        <div style="height:350px">
                            <canvas id="graficaSisMensual"></canvas>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<script>
    if (typeof ChartDataLabels !== 'undefined') {
        Chart.register(ChartDataLabels);
    }

    /* ==========================================================================
       1. ESTADO GLOBAL Y CONFIGURACIÓN
       ========================================================================== */
    const controlAnual = JSON.parse(
        document.getElementById("sis-meta")?.dataset.control || "[]"
    );
    const sisResultados = JSON.parse('{{ resultados | tojson | safe }}');
    const FILAS_POR_PAGINA = 10;

    let datosActuales = [];
    let datosFiltradosSis = [...sisResultados];
    let paginaActual = 1;
    let anioActivo = null;

    let mostrarValoresMensual = false;

    let graficaAnio = null;
    let graficaUnidad = null;
    let graficaSisMensual = null;

    let debounceTimer = null;

    /* ==========================================================================
       2. FUNCIONES DE UTILIDAD
       ========================================================================== */
    function fmt(n) {
        return Number(n || 0).toLocaleString("es-MX");
    }

    function normalizarTexto(val) {
        if (val === null || val === undefined) return "";
        return String(val).trim().toLowerCase();
    }

    function normalizarClave(val) {
        if (val === null || val === undefined) return "";
        return String(val).trim().replace(/^0+/, '');
    }

    function formatearFechaES(fechaStr) {
        if (!fechaStr) return "";
        let fecha;
        if (fechaStr.includes("-")) {
            const [y, m, d] = fechaStr.split("-");
            fecha = new Date(Date.UTC(y, m - 1, d));
        } else {
            fecha = new Date(fechaStr);
        }

        const meses = [
            "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
            "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
        ];

        return `${fecha.getUTCDate()} de ${meses[fecha.getUTCMonth()]} de ${fecha.getUTCFullYear()}`;
    }

    function actualizarEncabezadoSIS(anio) {
        const meta = document.getElementById("sis-meta");
        if (!meta) return;

        const registro = controlAnual.find(r => r.anio === anio);
        if (!registro) {
            meta.textContent = "";
            return;
        }

        meta.textContent = ` | ${registro.estatus_inicio} al ${formatearFechaES(registro.fecha_actualizacion)} · ${registro.estatus}`;
    }

    function actualizarTituloGabineteTotal(chart) {
        const elTitulo = document.getElementById("tituloGraficaSis");
        if (!elTitulo) return;

        let totalGabinete = 0;
        chart.data.datasets.forEach((dataset, index) => {
            if (chart.isDatasetVisible(index)) {
                totalGabinete += dataset.data.reduce((acc, curr) => acc + (Number(curr) || 0), 0);
            }
        });

        elTitulo.innerHTML = `Indicadores <strong>${anioActivo || ''}</strong> — Total: <strong>${fmt(totalGabinete)}</strong>`;
    }

    /* ==========================================================================
       3. PROCESAMIENTO Y FILTRADO ROBUSTO
       ========================================================================== */
    function agruparDatos(data) {
        const mapa = {};
        const nivelAgrupacion = document.getElementById('selectNivelAgrupacion')?.value || 'clues';

        data.forEach(r => {
            const jur = r.jurisdiccion !== undefined && r.jurisdiccion !== null ? String(r.jurisdiccion).trim() : 'Sin Especificar';
            const mun = r.municipio !== undefined && r.municipio !== null ? String(r.municipio).trim() : 'Sin Especificar';
            const clues = r.clues || 'Sin CLUES';
            const nombreUnidad = r.nombre_unidad || clues;

            let key = "";
            let nombreEtiqueta = "";

            if (nivelAgrupacion === 'jurisdiccion') {
                key = `${r.anio}-JUR-${jur}`;
                nombreEtiqueta = `Jurisdicción ${jur}`;
            } else if (nivelAgrupacion === 'municipio') {
                key = `${r.anio}-MUN-${mun}`;
                nombreEtiqueta = mun;
            } else {
                key = `${r.anio}-${jur}-${mun}-${clues}`;
                nombreEtiqueta = nombreUnidad;
            }

            if (!mapa[key]) {
                mapa[key] = {
                    anio: r.anio,
                    jurisdiccion: jur,
                    municipio: mun,
                    clues: (nivelAgrupacion === 'clues') ? clues : '-',
                    nombre_unidad: nombreEtiqueta,
                    consultas: 0,
                    embarazadas: 0,
                    mental: 0,
                    bucal: 0,
                    tamiz: 0,
                    planificacion_familiar: 0,
                    detecciones: 0
                };
            }

            mapa[key].consultas += Number(r.consultas) || 0;
            mapa[key].embarazadas += Number(r.embarazadas) || 0;
            mapa[key].mental += Number(r.mental) || 0;
            mapa[key].bucal += Number(r.bucal) || 0;
            mapa[key].tamiz += Number(r.tamiz) || 0;
            mapa[key].planificacion_familiar += Number(r.planificacion_familiar) || 0;
            mapa[key].detecciones += Number(r.detecciones) || 0;
        });

        return Object.values(mapa);
    }

    function procesarFiltradoInterno() {
        const anios = window.getAniosSeleccionados ? window.getAniosSeleccionados().map(String) : [];
        const meses = window.getMesesSeleccionados ? window.getMesesSeleccionados().map(Number) : [];

        const rawJur = window.getJurisdiccionesSeleccionadas ? window.getJurisdiccionesSeleccionadas() : [];
        const rawMun = window.getMunicipiosSeleccionados ? window.getMunicipiosSeleccionados() : [];
        const rawUni = window.getUnidadesSeleccionadas ? window.getUnidadesSeleccionadas() : [];

        const jurFiltros = rawJur.map(v => normalizarClave(v));
        const munFiltrosClaves = rawMun.map(v => normalizarClave(v));
        const munFiltrosTextos = rawMun.map(v => normalizarTexto(v));
        const uniFiltros = rawUni.map(v => normalizarTexto(v));

        const filtrados = sisResultados.filter(r => {
            const jurClave = normalizarClave(r.jurisdiccion);
            const munClave = normalizarClave(r.municipio);
            const munTexto = normalizarTexto(r.municipio);
            const cluesTexto = normalizarTexto(r.clues);
            const nombreUnidadTexto = normalizarTexto(r.nombre_unidad);

            const matchAnio = anios.length === 0 || anios.includes(String(r.anio));
            const matchMes = meses.length === 0 || meses.includes(Number(r.mes));
            const matchJur = jurFiltros.length === 0 || jurFiltros.includes(jurClave);

            const matchMun = munFiltrosClaves.length === 0 ||
                munFiltrosClaves.includes(munClave) ||
                munFiltrosTextos.includes(munTexto);

            const matchUni = uniFiltros.length === 0 ||
                uniFiltros.includes(cluesTexto) ||
                uniFiltros.includes(nombreUnidadTexto);

            return matchAnio && matchMes && matchJur && matchMun && matchUni;
        });

        datosActuales = agruparDatos(filtrados);
        datosFiltradosSis = filtrados;
        paginaActual = 1;

        renderTabsAnios(datosActuales);
        renderTablaSis();
        renderGraficaPorAnio(datosActuales);
        renderGraficaPorUnidad(datosActuales.filter(r => r.anio === anioActivo));

        graficaSisPorMes(datosFiltradosSis);
    }

    window.ejecutarFiltradoSis = function () {
        if (debounceTimer) clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            procesarFiltradoInterno();
        }, 60);
    };

    window.cargarDatosSis = window.ejecutarFiltradoSis;
    window.cargarTablaSis = window.ejecutarFiltradoSis;

    /* ==========================================================================
       4. TABLA Y TABS
       ========================================================================== */
    function renderTabsAnios(data) {
        const tabs = document.getElementById("tabsAnios");
        if (!tabs) return;
        tabs.innerHTML = "";

        const anios = [...new Set(data.map(r => r.anio))].sort((a, b) => b - a);

        if (anios.length === 0) {
            anioActivo = null;
            return;
        }

        anios.forEach((anio, i) => {
            const li = document.createElement("li");
            li.className = "nav-item";
            li.innerHTML = `<button class="nav-link ${i === 0 ? 'active' : ''}">${anio}</button>`;

            li.querySelector("button").addEventListener("click", (e) => {
                document.querySelectorAll("#tabsAnios .nav-link").forEach(b => b.classList.remove("active"));
                e.target.classList.add("active");

                anioActivo = anio;
                paginaActual = 1;

                renderTablaSis();
                renderGraficaPorUnidad(datosActuales.filter(r => r.anio === anioActivo));
            });

            tabs.appendChild(li);
        });

        if (!anioActivo || !anios.includes(anioActivo)) {
            anioActivo = anios[0];
        }
    }

    function renderTablaSis() {
        actualizarEncabezadoSIS(anioActivo);

        const tbody = document.getElementById("tablaSIS");
        const paginacion = document.getElementById("paginacionTabla");

        if (!tbody || !paginacion) return;

        tbody.innerHTML = "";
        paginacion.innerHTML = "";

        const datosFiltrados = datosActuales.filter(r => r.anio === anioActivo);
        const inicio = (paginaActual - 1) * FILAS_POR_PAGINA;
        const paginaDatos = datosFiltrados.slice(inicio, inicio + FILAS_POR_PAGINA);

        let filasHTML = "";
        paginaDatos.forEach(r => {
            filasHTML += `
                <tr>
                    <td class="text-center">${r.anio}</td>
                    <td>${r.clues}</td>
                    <td>${r.nombre_unidad}</td>
                    <td class="text-center">${fmt(r.consultas)}</td>
                    <td class="text-center">${fmt(r.embarazadas)}</td>
                    <td class="text-center">${fmt(r.mental)}</td>
                    <td class="text-center">${fmt(r.bucal)}</td>
                    <td class="text-center">${fmt(r.tamiz)}</td>
                    <td class="text-center">${fmt(r.planificacion_familiar)}</td>
                    <td class="text-center">${fmt(r.detecciones)}</td>
                </tr>`;
        });
        tbody.innerHTML = filasHTML;

        const totalPaginas = Math.ceil(datosFiltrados.length / FILAS_POR_PAGINA);
        for (let i = 1; i <= totalPaginas; i++) {
            const li = document.createElement("li");
            li.className = `page-item ${i === paginaActual ? "active" : ""}`;
            li.innerHTML = `<button class="page-link">${i}</button>`;
            li.onclick = () => {
                paginaActual = i;
                renderTablaSis();
            };
            paginacion.appendChild(li);
        }
    }

    /* ==========================================================================
       5. RENDERIZADO DE GRÁFICAS
       ========================================================================== */
    function renderGraficaPorAnio(data = datosActuales) {
        const arrSafe = data || [];
        const porAnio = {};
        arrSafe.forEach(r => {
            porAnio[r.anio] = (porAnio[r.anio] || 0) + (Number(r.consultas) || 0);
        });

        const anios = Object.keys(porAnio).sort();
        const colores = ['#4E79A7', '#59A14F', '#F28E2B', '#E15759', '#76B7B2', '#EDC948', '#B07AA1', '#FF9DA7'];

        const datasets = anios.map((anio, i) => ({
            label: `Año ${anio}`,
            data: anios.map(a => a === anio ? porAnio[anio] : 0),
            backgroundColor: colores[i % colores.length]
        }));

        if (graficaAnio) graficaAnio.destroy();

        const ctx = document.getElementById('graficaSisPorAnio');
        if (!ctx) return;

        graficaAnio = new Chart(ctx, {
            type: 'bar',
            data: { labels: anios, datasets },
            options: {
                responsive: true,
                scales: {
                    x: { stacked: true },
                    y: { beginAtZero: true, ticks: { callback: v => Number(v).toLocaleString("es-MX") } }
                },
                plugins: {
                    legend: { position: 'top' },
                    datalabels: {
                        anchor: 'end',
                        align: 'top',
                        formatter: (val) => val > 0 ? fmt(val) : '',
                        font: { weight: 'bold', size: 10 }
                    }
                }
            }
        });
    }

    function renderGraficaPorUnidad(data = datosActuales.filter(r => r.anio === anioActivo)) {
        const arrSafe = data || [];
        let labels = arrSafe.map(r => r.nombre_unidad || r.clues);
        let datasetsData = {
            consultas: arrSafe.map(r => Number(r?.consultas) || 0),
            embarazadas: arrSafe.map(r => Number(r?.embarazadas) || 0),
            mental: arrSafe.map(r => Number(r?.mental) || 0),
            bucal: arrSafe.map(r => Number(r?.bucal) || 0),
            tamiz: arrSafe.map(r => Number(r?.tamiz) || 0),
            planificacion_familiar: arrSafe.map(r => Number(r?.planificacion_familiar) || 0),
            detecciones: arrSafe.map(r => Number(r?.detecciones) || 0)
        };

        if (graficaUnidad) graficaUnidad.destroy();

        const ctx = document.getElementById('graficaSis');
        if (!ctx) return;

        graficaUnidad = new Chart(ctx, {
            type: 'bar',
            data: {
                labels,
                datasets: [
                    { label: 'Consultas', data: datasetsData.consultas, backgroundColor: '#4E79A7' },
                    { label: 'Embarazadas', data: datasetsData.embarazadas, backgroundColor: '#F28E2B' },
                    { label: 'Salud Mental', data: datasetsData.mental, backgroundColor: '#E15759' },
                    { label: 'Salud Bucal', data: datasetsData.bucal, backgroundColor: '#76B7B2' },
                    { label: 'Tamiz', data: datasetsData.tamiz, backgroundColor: '#59A14F' },
                    { label: 'Planificación Familiar', data: datasetsData.planificacion_familiar, backgroundColor: '#EDC948' },
                    { label: 'Detecciones', data: datasetsData.detecciones, backgroundColor: '#B07AA1' }
                ]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                scales: {
                    x: { stacked: true, ticks: { callback: v => Number(v).toLocaleString("es-MX") } },
                    y: { stacked: true }
                },
                plugins: {
                    datalabels: {
                        color: '#fff',
                        font: { weight: 'bold', size: 10 },
                        formatter: (val) => val > 0 ? fmt(val) : ''
                    }
                }
            }
        });

        actualizarTituloGabineteTotal(graficaUnidad);
    }

    function graficaSisPorMes(data = datosFiltradosSis) {
        const detalle = document.getElementById("filtroSisDetalle")?.value || "consultas";
        const ctx = document.getElementById("graficaSisMensual");

        if (!data || data.length === 0 || !ctx) {
            if (graficaSisMensual) graficaSisMensual.destroy();
            return;
        }

        const mesesNombres = {
            1: "Enero", 2: "Febrero", 3: "Marzo", 4: "Abril",
            5: "Mayo", 6: "Junio", 7: "Julio", 8: "Agosto",
            9: "Septiembre", 10: "Octubre", 11: "Noviembre", 12: "Diciembre"
        };

        const meses = Array.from({ length: 12 }, (_, i) => i + 1);
        const labels = meses.map(m => mesesNombres[m]);
        const resumen = {};

        data.forEach(r => {
            if (!r.mes) return;
            const mes = Number(r.mes);
            const anio = r.anio;
            let valor = (detalle && r[detalle] !== undefined) ? (Number(r[detalle]) || 0) : 0;
            const key = `Total ${anio}`;

            if (!resumen[key]) resumen[key] = {};
            resumen[key][mes] = (resumen[key][mes] || 0) + valor;
        });

        const datasets = Object.keys(resumen).map(key => ({
            label: key,
            data: meses.map(m => resumen[key][m] || 0),
            tension: 0.35,
            pointRadius: 4,
            fill: false
        }));

        if (graficaSisMensual) graficaSisMensual.destroy();

        graficaSisMensual = new Chart(ctx, {
            type: "line",
            data: { labels, datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, ticks: { callback: v => Number(v).toLocaleString("es-MX") } }
                },
                plugins: {
                    datalabels: {
                        display: () => mostrarValoresMensual,
                        align: 'top',
                        formatter: (val) => val > 0 ? fmt(val) : '',
                        font: { size: 9, weight: 'bold' }
                    }
                }
            }
        });
    }

    /* ==========================================================================
       6. INICIALIZACIÓN Y EVENT LISTENERS
       ========================================================================== */
    document.addEventListener("DOMContentLoaded", () => {
        window.ejecutarFiltradoSis();

        // Conexión con el CustomEvent emitido desde menu.html
        document.addEventListener("aplicarFiltroUnidades", () => {
            window.ejecutarFiltradoSis();
        });

        document.getElementById("filtroSisDetalle")?.addEventListener("change", () => {
            graficaSisPorMes(datosFiltradosSis);
        });

        document.getElementById("selectNivelAgrupacion")?.addEventListener("change", () => {
            window.ejecutarFiltradoSis();
        });

        document.getElementById("btnToggleValoresMensual")?.addEventListener("click", (e) => {
            mostrarValoresMensual = !mostrarValoresMensual;
            e.target.textContent = mostrarValoresMensual ? "Ocultar valores" : "Mostrar valores";
            graficaSisPorMes(datosFiltradosSis);
        });
    });
</script>

{% endblock %}
