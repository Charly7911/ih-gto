{% extends "layout/base.html" %}
{% block content %}
<div class="main-content">
    <div class="container-fluid mt-4 ps-4 pe-4">

        <h2 class="mb-3" id="sis-title">
            🏥 SIS - Primer Nivel
            <span id="sis-meta" style="font-size: 18px;" data-control='{{ control_anual | tojson | safe }}'></span>
        </h2>

        <!-- GRÁFICAS SUPERIORES -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <h6 class="text-muted mb-2">Total Atenciones por Año</h6>
                        <canvas id="graficaSisPorAnio"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <h6 class="text-muted mb-2" id="tituloGraficaSis">Indicadores por Unidad</h6>
                        <canvas id="graficaSis"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABLA DE RESULTADOS -->
        <div class="card">
            <div class="card-body">
                <ul class="nav nav-tabs mb-3" id="tabsAnios"></ul>
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-sm align-middle" id="tablaResultados">
                        <thead>
                            <tr>
                                <th class="text-center">Año</th>
                                <th>CLUES</th>
                                <th>Unidad</th>
                                <th class="text-center">Consultas</th>
                                <th class="text-center">Embarazadas</th>
                                <th class="text-center">Salud Mental</th>
                                <th class="text-center">Salud Bucal</th>
                                <th class="text-center">Tamiz</th>
                                <th class="text-center">Planificación Fam.</th>
                                <th class="text-center">Detecciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaSIS"></tbody>
                    </table>
                </div>

                <!-- PAGINACIÓN -->
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <small class="text-muted" id="infoPaginacion"></small>
                    <nav>
                        <ul class="pagination pagination-sm mb-0" id="paginacionTabla"></ul>
                    </nav>
                </div>

                <!-- GRÁFICA TEMPORAL -->
                <hr class="my-4">
                <div class="card mb-2">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                            <h5 class="mb-0">📈 Evolución Temporal SIS</h5>

                            <div class="d-flex gap-2 align-items-center flex-wrap">
                                <select id="selectTipoVistaTemporal"
                                    class="form-select form-select-sm w-auto fw-bold text-primary border-primary">
                                    <option value="mes" selected>Vista Mensual</option>
                                    <option value="anio">Vista Anual (Acumulado)</option>
                                </select>

                                <select id="filtroSisDetalle" class="form-select form-select-sm w-auto fw-bold">
                                    <option value="consultas" selected>Consultas</option>
                                    <option value="embarazadas">Embarazadas</option>
                                    <option value="mental">Salud Mental</option>
                                    <option value="bucal">Salud Bucal</option>
                                    <option value="tamiz">Tamiz</option>
                                    <option value="planificacion_familiar">Planificación Familiar</option>
                                    <option value="detecciones">Detecciones</option>
                                </select>

                                <button type="button" class="btn btn-outline-primary btn-sm"
                                    id="btnToggleValoresMensual">
                                    Mostrar valores
                                </button>
                            </div>
                        </div>

                        <div style="height:350px">
                            <canvas id="graficaSisMensual"></canvas>
                        </div>

                        <!-- DESGLOSE DINÁMICO DESDE CATÁLOGO DE BD -->
                        <div class="mt-3 pt-3 border-top bg-light p-3 rounded">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label class="form-label font-weight-bold mb-0 text-secondary"
                                    id="lblSubvariablesModulo">
                                    📋 Apartados y Variables del Catálogo:
                                </label>
                                <div>
                                    <button type="button" class="btn btn-xs btn-outline-secondary py-0"
                                        id="btnSeleccionarTodasSub">Todas</button>
                                    <button type="button" class="btn btn-xs btn-outline-secondary py-0"
                                        id="btnDesmarcarTodasSub">Ninguna</button>
                                </div>
                            </div>

                            <div id="contenedorSubvariables" style="max-height: 250px; overflow-y: auto;">
                                <!-- Se renderiza dinámicamente desde el catálogo traído por Backend -->
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<script>
    if (typeof ChartDataLabels !== 'undefined') {
        Chart.register(ChartDataLabels);
    }


    /* 1. SE INYECTAN LOS DATOS Y CATÁLOGO DIRECTAMENTE DEL BACKEND (FLASK) */
    const controlAnual = JSON.parse('{{ (control_anual | default([])) | tojson | safe }}');
    const sisResultados = JSON.parse('{{ (resultados | default([])) | tojson | safe }}');
    const DICCIONARIO_VARIABLES = JSON.parse('{{ (catalogo_variables | default({})) | tojson | safe }}');

    const FILAS_POR_PAGINA = 15;

    let datosActuales = [];
    let datosFiltradosSis = [...sisResultados];
    let paginaActual = 1;
    let anioActivo = null;

    let mostrarValoresMensual = false;
    let subvariablesSeleccionadas = [];

    let graficaAnio = null;
    let graficaUnidad = null;
    let graficaSisMensual = null;
    let debounceTimer = null;

    function fmt(n) { return Number(n || 0).toLocaleString("es-MX"); }
    function normalizarTexto(val) { return !val ? "" : String(val).trim().toLowerCase(); }
    function normalizarClave(val) { return !val ? "" : String(val).trim().replace(/^0+/, ''); }

    function actualizarEncabezadoSIS(anio) {
        const meta = document.getElementById("sis-meta");
        if (!meta) return;
        const registro = controlAnual.find(r => r.anio === anio);
        meta.textContent = registro ? ` | ${registro.estatus_inicio} · ${registro.estatus}` : "";
    }

    /* 2. DIBUJAR APARTADOS Y CHECKBOXES USANDO EL CATÁLOGO DINÁMICO */
    function renderSubvariables() {
        const modulo = document.getElementById("filtroSisDetalle")?.value || "consultas";
        const contenedor = document.getElementById("contenedorSubvariables");
        const lbl = document.getElementById("lblSubvariablesModulo");

        if (!contenedor) return;

        // Extrae directamente los datos del catálogo que mandó Flask
        const estructuraModulo = DICCIONARIO_VARIABLES[modulo] || [];

        subvariablesSeleccionadas = [];
        estructuraModulo.forEach(grupo => {
            (grupo.variables || []).forEach(v => subvariablesSeleccionadas.push(v.codigo));
        });

        const selectEl = document.getElementById("filtroSisDetalle");
        const nombreModulo = selectEl ? selectEl.options[selectEl.selectedIndex]?.text : modulo;
        if (lbl) lbl.innerHTML = `📋 Desglose de Apartados en <strong>${nombreModulo}</strong> (${subvariablesSeleccionadas.length} variables en catálogo):`;

        let html = "";

        if (estructuraModulo.length === 0) {
            contenedor.innerHTML = `<span class="text-muted small">No hay variables configuradas en el catálogo para este módulo.</span>`;
            return;
        }

        estructuraModulo.forEach(grupo => {
            html += `
                <div class="mb-3 p-2 bg-white rounded border">
                    <div class="fw-bold text-primary mb-1 border-bottom pb-1 small">
                        📁 Apartado: ${grupo.apartado} — <span class="text-dark">${grupo.descripcion_apartado || 'Sin descripción'}</span>
                    </div>
                    <div class="d-flex flex-wrap gap-2 pt-1">`;

            (grupo.variables || []).forEach(v => {
                html += `
                    <div class="form-check form-check-inline me-3 mb-1" title="${v.nombre}">
                        <input class="form-check-input chk-subvar" type="checkbox" id="sub_${v.codigo}" value="${v.codigo}" checked>
                        <label class="form-check-label small" for="sub_${v.codigo}">
                            <strong>${v.codigo}</strong>: ${v.nombre}
                        </label>
                    </div>`;
            });

            html += `
                    </div>
                </div>`;
        });

        contenedor.innerHTML = html;

        contenedor.querySelectorAll('.chk-subvar').forEach(cb => {
            cb.addEventListener('change', () => {
                subvariablesSeleccionadas = Array.from(contenedor.querySelectorAll('.chk-subvar:checked')).map(c => c.value);
                renderGraficaTemporal(datosFiltradosSis);
            });
        });
    }

    /* 3. PROCESAMIENTO Y FILTRADO DE DATOS */
    function agruparDatos(data) {
        const mapa = {};
        const nivelAgrupacion = document.getElementById('selectNivelAgrupacion')?.value || 'clues';

        data.forEach(r => {
            const jur = r.jurisdiccion ? String(r.jurisdiccion).trim() : 'Sin Especificar';
            const mun = r.municipio ? String(r.municipio).trim() : 'Sin Especificar';
            const clues = r.clues || 'Sin CLUES';
            const nombreUnidad = r.nombre_unidad || clues;

            let key = `${r.anio}-${jur}-${mun}-${clues}`;
            let nombreEtiqueta = nombreUnidad;

            if (nivelAgrupacion === 'jurisdiccion') {
                key = `${r.anio}-JUR-${jur}`;
                nombreEtiqueta = `Jurisdicción ${jur}`;
            } else if (nivelAgrupacion === 'municipio') {
                key = `${r.anio}-MUN-${mun}`;
                nombreEtiqueta = mun;
            }

            if (!mapa[key]) {
                mapa[key] = {
                    anio: r.anio,
                    jurisdiccion: jur,
                    municipio: mun,
                    clues: (nivelAgrupacion === 'clues') ? clues : '-',
                    nombre_unidad: nombreEtiqueta,
                    consultas: 0, embarazadas: 0, mental: 0, bucal: 0, tamiz: 0, planificacion_familiar: 0, detecciones: 0
                };
            }

            mapa[key].consultas += Number(r.consultas) || 0;
            mapa[key].embarazadas += Number(r.embarazadas) || 0;
            mapa[key].mental += Number(r.mental) || 0;
            mapa[key].bucal += Number(r.bucal) || 0;
            mapa[key].tamiz += Number(r.tamiz) || 0;
            mapa[key].planificacion_familiar += Number(r.planificacion_familiar) || 0;
            mapa[key].detecciones += Number(r.detecciones) || 0;
        });

        return Object.values(mapa);
    }

    function procesarFiltradoInterno() {
        const anios = window.getAniosSeleccionados ? window.getAniosSeleccionados().map(String) : [];
        const meses = window.getMesesSeleccionados ? window.getMesesSeleccionados().map(Number) : [];

        const rawJur = window.getJurisdiccionesSeleccionadas ? window.getJurisdiccionesSeleccionadas() : [];
        const rawMun = window.getMunicipiosSeleccionados ? window.getMunicipiosSeleccionados() : [];
        const rawUni = window.getUnidadesSeleccionadas ? window.getUnidadesSeleccionadas() : [];

        const jurFiltros = rawJur.map(v => normalizarClave(v));
        const munFiltrosClaves = rawMun.map(v => normalizarClave(v));
        const munFiltrosTextos = rawMun.map(v => normalizarTexto(v));
        const uniFiltros = rawUni.map(v => normalizarTexto(v));

        const filtrados = sisResultados.filter(r => {
            const jurClave = normalizarClave(r.jurisdiccion);
            const munClave = normalizarClave(r.municipio);
            const munTexto = normalizarTexto(r.municipio);
            const cluesTexto = normalizarTexto(r.clues);
            const nombreUnidadTexto = normalizarTexto(r.nombre_unidad);

            const matchAnio = anios.length === 0 || anios.includes(String(r.anio));
            const matchMes = meses.length === 0 || meses.includes(Number(r.mes));
            const matchJur = jurFiltros.length === 0 || jurFiltros.includes(jurClave);
            const matchMun = munFiltrosClaves.length === 0 || munFiltrosClaves.includes(munClave) || munFiltrosTextos.includes(munTexto);
            const matchUni = uniFiltros.length === 0 || uniFiltros.includes(cluesTexto) || uniFiltros.includes(nombreUnidadTexto);

            return matchAnio && matchMes && matchJur && matchMun && matchUni;
        });

        datosActuales = agruparDatos(filtrados);
        datosFiltradosSis = filtrados;
        paginaActual = 1;

        renderTabsAnios(datosActuales);
        renderTablaSis();
        renderGraficaPorAnio(datosActuales);
        renderGraficaPorUnidad(datosActuales.filter(r => r.anio === anioActivo));
        renderGraficaTemporal(datosFiltradosSis);
    }

    window.ejecutarFiltradoSis = function () {
        if (debounceTimer) clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => { procesarFiltradoInterno(); }, 60);
    };

    /* 4. TABLA Y TABS */
    function renderTabsAnios(data) {
        const tabs = document.getElementById("tabsAnios");
        if (!tabs) return;
        tabs.innerHTML = "";

        const anios = [...new Set(data.map(r => r.anio))].sort((a, b) => b - a);
        if (anios.length === 0) { anioActivo = null; return; }

        anios.forEach((anio, i) => {
            const li = document.createElement("li");
            li.className = "nav-item";
            li.innerHTML = `<button class="nav-link ${i === 0 ? 'active' : ''}">${anio}</button>`;

            li.querySelector("button").addEventListener("click", (e) => {
                document.querySelectorAll("#tabsAnios .nav-link").forEach(b => b.classList.remove("active"));
                e.target.classList.add("active");

                anioActivo = anio;
                paginaActual = 1;

                renderTablaSis();
                renderGraficaPorUnidad(datosActuales.filter(r => r.anio === anioActivo));
            });

            tabs.appendChild(li);
        });

        if (!anioActivo || !anios.includes(anioActivo)) anioActivo = anios[0];
    }

    function renderTablaSis() {
        actualizarEncabezadoSIS(anioActivo);
        const tbody = document.getElementById("tablaSIS");
        const paginacion = document.getElementById("paginacionTabla");
        const infoPaging = document.getElementById("infoPaginacion");

        if (!tbody || !paginacion) return;
        tbody.innerHTML = ""; paginacion.innerHTML = "";

        const datosFiltrados = datosActuales.filter(r => r.anio === anioActivo);
        const inicio = (paginaActual - 1) * FILAS_POR_PAGINA;
        const paginaDatos = datosFiltrados.slice(inicio, inicio + FILAS_POR_PAGINA);

        if (infoPaging) {
            infoPaging.textContent = `Mostrando ${paginaDatos.length} de ${datosFiltrados.length} registros (Página ${paginaActual})`;
        }

        let filasHTML = "";
        paginaDatos.forEach(r => {
            filasHTML += `
                <tr>
                    <td class="text-center fw-bold">${r.anio}</td>
                    <td><small class="text-muted">${r.clues}</small></td>
                    <td>${r.nombre_unidad}</td>
                    <td class="text-center">${fmt(r.consultas)}</td>
                    <td class="text-center">${fmt(r.embarazadas)}</td>
                    <td class="text-center">${fmt(r.mental)}</td>
                    <td class="text-center">${fmt(r.bucal)}</td>
                    <td class="text-center">${fmt(r.tamiz)}</td>
                    <td class="text-center">${fmt(r.planificacion_familiar)}</td>
                    <td class="text-center">${fmt(r.detecciones)}</td>
                </tr>`;
        });
        tbody.innerHTML = filasHTML;

        const totalPaginas = Math.ceil(datosFiltrados.length / FILAS_POR_PAGINA);
        for (let i = 1; i <= totalPaginas; i++) {
            const li = document.createElement("li");
            li.className = `page-item ${i === paginaActual ? "active" : ""}`;
            li.innerHTML = `<button class="page-link">${i}</button>`;
            li.onclick = () => { paginaActual = i; renderTablaSis(); };
            paginacion.appendChild(li);
        }
    }

    /* 5. GRÁFICAS */
    function renderGraficaPorAnio(data = datosActuales) {
        const arrSafe = data || [];
        const porAnio = {};

        arrSafe.forEach(r => {
            const sumaFila = (Number(r.consultas) || 0) + (Number(r.embarazadas) || 0) + (Number(r.mental) || 0) +
                (Number(r.bucal) || 0) + (Number(r.tamiz) || 0) + (Number(r.planificacion_familiar) || 0) +
                (Number(r.detecciones) || 0);
            porAnio[r.anio] = (porAnio[r.anio] || 0) + sumaFila;
        });

        const anios = Object.keys(porAnio).sort();
        const colores = ['#4E79A7', '#59A14F', '#F28E2B', '#E15759', '#76B7B2', '#EDC948', '#B07AA1'];

        if (graficaAnio) graficaAnio.destroy();
        const ctx = document.getElementById('graficaSisPorAnio');
        if (!ctx) return;

        graficaAnio = new Chart(ctx, {
            type: 'bar',
            data: { labels: anios, datasets: [{ label: 'Total Acumulado', data: anios.map(a => porAnio[a]), backgroundColor: colores }] },
            options: {
                responsive: true,
                scales: { y: { beginAtZero: true, ticks: { callback: v => fmt(v) } } },
                plugins: {
                    legend: { display: false },
                    datalabels: { anchor: 'end', align: 'top', formatter: (val) => val > 0 ? fmt(val) : '', font: { weight: 'bold', size: 11 }, color: '#333' }
                }
            }
        });
    }

    function renderGraficaPorUnidad(data = datosActuales.filter(r => r.anio === anioActivo)) {
        let arrSafe = data.length > 0 ? data : datosActuales;
        const labels = arrSafe.map(r => r.nombre_unidad || r.clues);

        const configVars = {
            consultas: { label: 'Consultas', color: '#4E79A7' },
            embarazadas: { label: 'Embarazadas', color: '#F28E2B' },
            mental: { label: 'Salud Mental', color: '#E15759' },
            bucal: { label: 'Salud Bucal', color: '#76B7B2' },
            tamiz: { label: 'Tamiz', color: '#59A14F' },
            planificacion_familiar: { label: 'Planificación Fam.', color: '#EDC948' },
            detecciones: { label: 'Detecciones', color: '#B07AA1' }
        };

        const datasets = Object.keys(configVars).map(v => ({
            label: configVars[v].label,
            data: arrSafe.map(r => Number(r[v]) || 0),
            backgroundColor: configVars[v].color
        }));

        if (graficaUnidad) graficaUnidad.destroy();
        const ctx = document.getElementById('graficaSis');
        if (!ctx) return;

        graficaUnidad = new Chart(ctx, {
            type: 'bar',
            data: { labels, datasets },
            options: {
                indexAxis: 'y',
                responsive: true,
                scales: { x: { stacked: true, ticks: { callback: v => fmt(v) } }, y: { stacked: true } },
                plugins: {
                    datalabels: { color: '#fff', font: { weight: 'bold', size: 10 }, formatter: (val) => val > 0 ? fmt(val) : '' }
                }
            }
        });

        const elTitulo = document.getElementById("tituloGraficaSis");
        if (elTitulo) {
            let totalGeneral = datasets.reduce((acc, ds) => acc + ds.data.reduce((a, b) => a + b, 0), 0);
            elTitulo.innerHTML = `Indicadores <strong>${anioActivo || 'General'}</strong> — Total Seleccionado: <strong>${fmt(totalGeneral)}</strong>`;
        }
    }

    function renderGraficaTemporal(data = datosFiltradosSis) {
        const modulo = document.getElementById("filtroSisDetalle")?.value || "consultas";
        const tipoVista = document.getElementById("selectTipoVistaTemporal")?.value || "mes";
        const ctx = document.getElementById("graficaSisMensual");

        if (!data || data.length === 0 || !ctx) {
            if (graficaSisMensual) graficaSisMensual.destroy();
            return;
        }

        const estructuraModulo = DICCIONARIO_VARIABLES[modulo] || [];
        let totalCodigosModulo = 0;
        estructuraModulo.forEach(g => totalCodigosModulo += (g.variables || []).length);

        const codigosSeleccionadosCount = subvariablesSeleccionadas.length;
        const factorProporcion = totalCodigosModulo > 0 ? (codigosSeleccionadosCount / totalCodigosModulo) : 1;

        let labels = [];
        let datasets = [];

        if (tipoVista === 'anio') {
            const acumuladoAnual = {};
            data.forEach(r => {
                const anio = r.anio;
                let val = 0;
                if (r.detalle_subvariables) {
                    subvariablesSeleccionadas.forEach(code => {
                        val += Number(r.detalle_subvariables[code]) || 0;
                    });
                } else {
                    val = (Number(r[modulo]) || 0) * factorProporcion;
                }
                acumuladoAnual[anio] = (acumuladoAnual[anio] || 0) + val;
            });

            labels = Object.keys(acumuladoAnual).sort();
            datasets = [{
                label: `Total Filtrado (${codigosSeleccionadosCount}/${totalCodigosModulo} variables)`,
                data: labels.map(a => Math.round(acumuladoAnual[a])),
                backgroundColor: '#4E79A7'
            }];
        } else {
            const mesesNombres = { 1: "Ene", 2: "Feb", 3: "Mar", 4: "Abr", 5: "May", 6: "Jun", 7: "Jul", 8: "Ago", 9: "Sep", 10: "Oct", 11: "Nov", 12: "Dic" };
            const meses = Array.from({ length: 12 }, (_, i) => i + 1);
            labels = meses.map(m => mesesNombres[m]);

            const resumen = {};
            data.forEach(r => {
                if (!r.mes) return;
                const mes = Number(r.mes);
                const anio = r.anio;

                let valor = 0;
                if (r.detalle_subvariables) {
                    subvariablesSeleccionadas.forEach(code => {
                        valor += Number(r.detalle_subvariables[code]) || 0;
                    });
                } else {
                    valor = (Number(r[modulo]) || 0) * factorProporcion;
                }

                const key = `Año ${anio}`;

                if (!resumen[key]) resumen[key] = {};
                resumen[key][mes] = (resumen[key][mes] || 0) + valor;
            });

            datasets = Object.keys(resumen).map(key => ({
                label: key,
                data: meses.map(m => Math.round(resumen[key][m] || 0)),
                tension: 0.3,
                pointRadius: 4,
                fill: false
            }));
        }

        if (graficaSisMensual) graficaSisMensual.destroy();

        graficaSisMensual = new Chart(ctx, {
            type: tipoVista === 'anio' ? 'bar' : 'line',
            data: { labels, datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, ticks: { callback: v => fmt(v) } } },
                plugins: {
                    datalabels: {
                        display: () => mostrarValoresMensual || tipoVista === 'anio',
                        align: 'top',
                        anchor: 'end',
                        formatter: (val) => val > 0 ? fmt(val) : '',
                        font: { size: 10, weight: 'bold' }
                    }
                }
            }
        });
    }

    /* 6. INICIALIZACIÓN Y EVENTOS */
    document.addEventListener("DOMContentLoaded", () => {
        renderSubvariables();
        window.ejecutarFiltradoSis();

        document.getElementById("filtroSisDetalle")?.addEventListener("change", () => {
            renderSubvariables();
            renderGraficaTemporal(datosFiltradosSis);
        });

        document.getElementById("selectTipoVistaTemporal")?.addEventListener("change", () => {
            renderGraficaTemporal(datosFiltradosSis);
        });

        document.getElementById("btnToggleValoresMensual")?.addEventListener("click", (e) => {
            mostrarValoresMensual = !mostrarValoresMensual;
            e.target.textContent = mostrarValoresMensual ? "Ocultar valores" : "Mostrar valores";
            renderGraficaTemporal(datosFiltradosSis);
        });

        document.getElementById("btnSeleccionarTodasSub")?.addEventListener("click", () => {
            document.querySelectorAll("#contenedorSubvariables .chk-subvar").forEach(cb => cb.checked = true);
            const modulo = document.getElementById("filtroSisDetalle")?.value || "consultas";
            subvariablesSeleccionadas = [];
            (DICCIONARIO_VARIABLES[modulo] || []).forEach(g => {
                (g.variables || []).forEach(v => subvariablesSeleccionadas.push(v.codigo));
            });
            renderGraficaTemporal(datosFiltradosSis);
        });

        document.getElementById("btnDesmarcarTodasSub")?.addEventListener("click", () => {
            document.querySelectorAll("#contenedorSubvariables .chk-subvar").forEach(cb => cb.checked = false);
            subvariablesSeleccionadas = [];
            renderGraficaTemporal(datosFiltradosSis);
        });
    });
</script>
{% endblock %}
