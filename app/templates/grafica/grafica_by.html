{% extends "layout/base.html" %} {% block content %}
<div class="main-content bg-light-gray">
  <div class="container-fluid py-3 px-4">

    <!-- 1. CABECERA PRINCIPAL (Título + Acciones globales) -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-3">
      <div>
        <h2 class="dashboard-title mb-1">Comparativo Dinámico</h2>
        <p class="dashboard-subtitle text-muted mb-0">Análisis de indicadores hospitalarios por unidad</p>
      </div>



      <!-- BOTONES PRINCIPALES -->
      <div class="d-flex align-items-center gap-2">
        <button id="btnExcel" onclick="descargarExcel()"
          class="btn btn-sm btn-success d-flex align-items-center gap-2 shadow-sm">
          <i class="bi bi-file-earmark-excel"></i>
          <span id="textoBtn">Descargar Excel</span>
        </button>

        <button onclick="limpiarTodo()"
          class="btn btn-sm btn-outline-danger d-flex align-items-center gap-2 shadow-sm bg-white">
          <i class="bi bi-arrow-repeat"></i>
          Nuevo Comparativo
        </button>
      </div>
    </div>

    <!-- 2. BARRA DE SELECCIÓN DE MESES -->
    <div class="card shadow-sm border-0 mb-3 card-meses">
      <div class="card-body py-2 px-3 d-flex flex-wrap align-items-center justify-content-between gap-3">

        <div class="d-flex align-items-center gap-3 flex-grow-1 flex-wrap">
          <div class="toolbar-meses fw-bold text-secondary d-flex align-items-center gap-2 text-uppercase small">
            <i class="bi bi-calendar3"></i> Meses
          </div>

          <!-- CHECKS / MESES -->
          <div id="checkMeses" class="meses-container d-flex flex-wrap gap-1 align-items-center">
            <!-- Renderizado dinámico de meses -->
          </div>
        </div>

        <!-- BOTONES RÁPIDOS DE MESES -->
        <div class="d-flex gap-2">
          <button class="btn btn-xs btn-outline-primary rounded-pill px-2" onclick="seleccionarTodosMeses()">
            <i class="bi bi-check2-square"></i> Todos
          </button>
          <button class="btn btn-xs btn-outline-secondary rounded-pill px-2" onclick="limpiarMeses()">
            <i class="bi bi-x-square"></i> Ninguno
          </button>
        </div>

      </div>
    </div>

    <div id="selection-summary" class="text-end small text-muted"></div>

    <!-- 3. DROP ZONE (Compacta para no robar espacio vertical) -->
    <div id="dropZone"
      class="drop-area-modern shadow-sm mb-3 py-3 border border-2 border-dashed rounded text-center bg-white">
      <div class="drop-content d-flex align-items-center justify-content-center gap-2 text-muted">
        <i class="bi bi-plus-circle fs-5 text-primary"></i>
        <span class="placeholder-text fw-medium">Arrastre indicadores y unidades aquí para comparar</span>
      </div>
    </div>

    <!-- 4. TARJETA PRINCIPAL DE LA GRÁFICA -->
    <div class="card graph-card border-0 shadow-sm">

      <!-- CABECERA CON CONTROLES ORGANIZADOS -->
      <div
        class="card-header bg-white border-bottom py-3 px-4 d-flex justify-content-between align-items-center flex-wrap gap-3">

        <!-- TÍTULO -->
        <h5 id="tituloGrafica" class="card-title-sm mb-0 fw-bold text-dark me-2">
          Tendencia Mensual
        </h5>

        <!-- CONTENEDOR DE CONTROLES (Agrupados limpia y modularmente) -->
        <div class="d-flex align-items-center gap-3 flex-wrap ms-auto">

          <!-- MODO DE VISTA -->
          <div class="d-flex align-items-center gap-2">
            <span class="text-uppercase text-muted fw-bold" style="font-size: 10px;">VISTA:</span>
            <div class="btn-group btn-group-sm" role="group" id="selectorModoVista">
              <input type="radio" class="btn-check" name="modoVista" id="vistaCombinada" value="combinada" checked>
              <label class="btn btn-outline-secondary text-nowrap btn-xs" for="vistaCombinada">COMBINADA</label>

              <input type="radio" class="btn-check" name="modoVista" id="vistaSeparada" value="separada">
              <label class="btn btn-outline-secondary text-nowrap btn-xs" for="vistaSeparada">POR INDICADOR</label>
            </div>
          </div>

          <!-- BARRA DE SWITCHES ENCAPSULADA EN UN PANEL LIGERO -->
          <div class="d-flex align-items-center gap-3 bg-light px-3 py-1 rounded border">

            <div class="form-check form-switch custom-switch m-0 d-inline-flex align-items-center gap-1">
              <input class="form-check-input mt-0" type="checkbox" id="switchEtiquetas" />
              <label class="form-check-label text-nowrap text-uppercase text-secondary fw-bold" style="font-size: 10px;"
                for="switchEtiquetas">
                Datos
              </label>
            </div>

            <div class="form-check form-switch custom-switch m-0 d-inline-flex align-items-center gap-1">
              <input class="form-check-input mt-0" type="checkbox" id="switchTendencia" />
              <label class="form-check-label text-nowrap text-uppercase text-secondary fw-bold" style="font-size: 10px;"
                for="switchTendencia">
                Tendencia
              </label>
            </div>

            <div class="form-check form-switch custom-switch m-0 d-inline-flex align-items-center gap-1">
              <input class="form-check-input mt-0" type="checkbox" id="switchUnidades" />
              <label class="form-check-label text-nowrap text-uppercase text-secondary fw-bold" style="font-size: 10px;"
                for="switchUnidades">
                Unidades
              </label>
            </div>

            <div class="form-check form-switch custom-switch m-0 align-items-center gap-1"
              id="contenedorAcumularTipologia" style="display: none !important;">
              <input class="form-check-input mt-0" type="checkbox" id="switchAcumularTipologia" />
              <label class="form-check-label text-nowrap text-uppercase text-secondary fw-bold" style="font-size: 10px;"
                for="switchAcumularTipologia">
                Acumulados
              </label>
            </div>

          </div>

          <!-- FILTRO DE TIPOLOGÍA DINÁMICO -->
          <div id="contenedorTipologia" class="btn-group btn-group-sm" role="group" style="display: none !important;">
            <input type="radio" class="btn-check" name="tipologia" id="tipTodas" value="TODAS" checked>
            <label class="btn btn-outline-secondary" for="tipTodas">Todas</label>

            <input type="radio" class="btn-check" name="tipologia" id="tipHG" value="HG">
            <label class="btn btn-outline-secondary" for="tipHG">HG</label>

            <input type="radio" class="btn-check" name="tipologia" id="tipHC" value="HC">
            <label class="btn btn-outline-secondary" for="tipHC">HC</label>

            <input type="radio" class="btn-check" name="tipologia" id="tipHE" value="HE">
            <label class="btn btn-outline-secondary" for="tipHE">HE</label>
          </div>

        </div>

      </div>

      <!-- CUERPO DE LA GRÁFICA (Máximo aprovechamiento de espacio) -->
      <!-- CUERPO DE LA GRÁFICA (Ajustado para laptops y pantallas dinámicas) -->
      <div class="card-body p-3">
        <div id="contenedorGraficas" class="chart-wrapper w-100">

          <!-- Se quitó la altura fija de 480px y se asignó una clase fluida -->
          <div class="grafica-container w-100"
            style="position: relative; height: clamp(280px, 42vh, 420px); min-height: 260px;">
            <canvas id="grafica"></canvas>
          </div>

          <div id="leyendaPersonalizada" class="mt-2 w-100"></div>

        </div>
      </div>

    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>


<script>

  window.CATALOGO_UNIDADES_SERVIDO = JSON.parse('{{ unidades | tojson | safe }}');
  let chart = null;

  let unidadesSeleccionadas = new Set();
  let indicadoresSeleccionados = new Set();
  let aniosSeleccionados = new Set();
  let mostrarTodasUnidades = false;
  let avisosMostrados = new Set();
  let alertasMostradas = new Set();
  let instanciasCharts = []
  let todasUnidades = [];
  let tipologiaSeleccionada = "TODAS";
  let timeoutRender = null;
  let indicadoresSinDatos = new Set();

  Chart.register(ChartDataLabels);

  // =========================
  // NORMALIZADOR GLOBAL
  // =========================
  const norm = (s) =>
    (s || "")
      .toString()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .trim()
      .replace(/\s+/g, "_");

  // =========================
  // LIMPIEZA DE NOMBRE
  // =========================
  function limpiarNombreUnidad(nombre) {
    if (!nombre) return "";
    return nombre.replace(/^[A-Z0-9]{10,14}\s+/, "").trim();
  }

  function nombreUnidad(unidad) {
    if (!unidad) return "";

    let texto = unidad;

    // 1. Limpiar sufijos como " - medica (2026)" o similares
    texto = texto.split("-")[0].trim();

    // 2. Reemplazar los prefijos principales (acepta espacios o guiones bajos)
    texto = texto
      .replace(/^HOSPITAL[ _]GENERAL[ _]/i, "HG ")
      .replace(/^HOSPITAL[ _]COMUNITARIO[ _]/i, "HC ")
      .replace(/^HOSPITAL[ _](DE[ _])?ESPECIALIDAD(ES)?[ _]/i, "HE ")
      .replace(/^CENTRO[ _]ESTATAL[ _]DE[ _]CUIDADOS[ _]CRITICOS[ _]/i, "CECC ")
      .replace(/^CENTRO[ _]DE[ _]ATENCION[ _]INTEGRAL[ _]A[ _]LA[ _]SALUD[ _]MENTAL[ _]/i, "CAISAME ");

    // 3. Cambiar todos los guiones bajos restantes por espacios
    texto = texto.replace(/_/g, " ");

    // 4. Limpiar espacios dobles
    texto = texto.replace(/\s+/g, " ").trim();

    // 5. Formatear cada palabra para que inicie con Mayúscula (ej: "abasolo" -> "Abasolo")
    return texto
      .toLowerCase()
      .split(" ")
      .map(p => {
        // Mantener siglas en mayúsculas (HG, HC, HE, CECC, CAISAME)
        if (["hg", "hc", "he", "cecc", "caisame"].includes(p)) return p.toUpperCase();
        return p.charAt(0).toUpperCase() + p.slice(1);
      })
      .join(" ");
  }


  function obtenerNombreIndicador(indicador) {
    if (!indicador) return "";
    const clave = indicador.toString().trim().toLowerCase();
    return nombresColumnas[clave] || indicador;
  }



  // =========================
  // CARGA DE UNIDADES
  // =========================
  fetch("/grafica/api/unidades")
    .then((r) => r.json())
    .then((data) => {
      todasUnidades = data;
      renderListaUnidades(data);
    })
    .catch((err) => console.error("Error cargando unidades:", err));

  // =========================
  // RENDER LISTA UNIDADES
  // =========================
  function renderListaUnidades(unidades) {

    const generales = document.getElementById("listaGenerales");
    const comunitarios = document.getElementById("listaComunitarios");
    const especialidad = document.getElementById("listaEspecialidad");

    generales.innerHTML = "";
    comunitarios.innerHTML = "";
    especialidad.innerHTML = "";

    unidades.forEach((u) => {

      const div = document.createElement("div");

      const nombreMostrar = limpiarNombreUnidad(u.nombre_unidad);

      div.className = "unidad-item-grafica";
      div.draggable = true;
      div.dataset.clues = u.clues;

      div.innerHTML = `
            <i class="bi bi-hospital" style="font-size:9px;opacity:.7;"></i>
            <span class="nombre-limpio">${nombreMostrar}</span>
        `;

      div.title = u.nombre_unidad;


      div.addEventListener("dragstart", (e) => {

        e.dataTransfer.setData(
          "application/json",
          JSON.stringify({
            type: "unidad",
            value: u.clues,
            nombre: nombreMostrar
          })
        );

      });


      // AGRUPACIÓN POR TIPOLOGÍA
      switch (u.tipologia) {

        case "HG":
          generales.appendChild(div);
          break;

        case "HC":
          comunitarios.appendChild(div);
          break;

        case "HE":
          especialidad.appendChild(div);
          break;

        default:
          generales.appendChild(div);
      }

    });

  }


  // ======================================================
  // CONFIGURACIÓN Y FUNCIONES DE MESES PARA LA GRÁFICA
  // ======================================================

  const LISTA_MESES_GRAFICA = [
    { id: 1, nombre: 'Ene' }, { id: 2, nombre: 'Feb' }, { id: 3, nombre: 'Mar' },
    { id: 4, nombre: 'Abr' }, { id: 5, nombre: 'May' }, { id: 6, nombre: 'Jun' },
    { id: 7, nombre: 'Jul' }, { id: 8, nombre: 'Ago' }, { id: 9, nombre: 'Sep' },
    { id: 10, nombre: 'Oct' }, { id: 11, nombre: 'Nov' }, { id: 12, nombre: 'Dic' }
  ];

  // Función para renderizar dinámicamente las pills de meses según el límite
  window.renderizarMesesGrafica = function (limiteMes = 12) {
    const container = document.getElementById("checkMeses");
    if (!container) return;

    // 1. Guardar qué meses estaban marcados previamente
    const chequesPrevios = Array.from(document.querySelectorAll(".mes-check:checked"))
      .map(el => parseInt(el.value, 10));

    // 2. Filtrar la lista de meses disponibles
    const mesesVisibles = LISTA_MESES_GRAFICA.filter(m => m.id <= limiteMes);

    // 3. Generar el nuevo HTML
    container.innerHTML = mesesVisibles.map(mes => {
      // Si no había nada seleccionado previamente (carga inicial), se marcan todos por defecto
      const isChecked = chequesPrevios.length === 0 || chequesPrevios.includes(mes.id);

      return `
      <input 
        type="checkbox" 
        id="mes${mes.id}" 
        class="mes-check" 
        value="${mes.id}" 
        ${isChecked ? 'checked' : ''} 
        onchange="cargarGrafica()" 
      />
      <label for="mes${mes.id}" class="mes-pill">${mes.nombre}</label>
    `;
    }).join('');
  };

  // Obtener la lista de valores de los meses marcados actualmente
  function obtenerMesesSeleccionados() {
    const meses = Array.from(
      document.querySelectorAll(".mes-check:checked")
    ).map(el => parseInt(el.value, 10));

    return meses;
  }

  // 1. Desmarcar todos los meses visibles
  function limpiarMeses() {
    document.querySelectorAll(".mes-check").forEach((el) => {
      el.checked = false;
    });

    cargarGrafica();
  }

  // 2. Seleccionar todos los meses visibles
  function seleccionarTodosMeses() {
    document.querySelectorAll(".mes-check").forEach((el) => {
      el.checked = true;
    });

    cargarGrafica();
  }


  function sincronizarMesesUIConDatos(data) {
    if (!Array.isArray(data) || data.length === 0) return;

    // Set de indicadores estáticos de equipo médico
    const equipoMedicoSet = new Set([
      "arco_c_analogo", "arco_c_digital", "bascula_estadimetro", "bascula_bebe",
      "camilla_radiotransp", "cardiotocografo", "carro_rojo_reanim", "cuna_calor_rad",
      "cuna_calor_rad_foto", "defibrilador_monit", "ecocardiografo", "electrocardiografo",
      "estuche_diag", "incubadora_fototer", "incubadora_trasl", "incubadora_cuidados",
      "lampara_quirurgica_doble", "lampara_quir_port", "lampara_quir_senc", "mesa_quir_obs",
      "mesa_exploracion", "mesa_quir_gral", "microscopio_rutina", "monitor_radiacion",
      "monitor_signos_vit_avanz", "monitor_signos_neo", "monitor_signos_bas", "monitor_traslado",
      "monitor_signos_int", "monitor_signos_vit_neona", "monitor_anestesia", "negatoscopio",
      "refrige_lab", "sierra_yesos", "ultrasonido_diag", "unidad_anestesia_bas",
      "ultrasonido_terap", "unidad_dental", "unidad_rx_analogo", "unidad_rx_dental",
      "unidad_rx_digital", "unidad_rx_port_ana", "unidad_rx_port_dig", "fluoroscopio_dig",
      "fluoroscopio_dig_analog", "mastografo_digital", "mastografo_estereo",
      "mastografo_estereo_tomosin", "microscopio_cirugia", "resonancia_mag",
      "tomografo_128", "tomografo_16", "tomografo_32", "tomografo_64"
    ]);

    // 1. Filtrar únicamente los datos dinámicos/operativos
    const datosDinamicos = data.filter(
      (d) => !equipoMedicoSet.has((d.indicador || "").toLowerCase())
    );

    let limiteMesDetectado = null;

    if (datosDinamicos.length > 0) {
      // 2. Si hay indicadores dinámicos, calculamos el mes máximo real (ej. 8 para Agosto)
      const mesesConDatos = datosDinamicos
        .filter((d) => Number(d.valor || 0) > 0 && Number(d.mes) >= 1 && Number(d.mes) <= 12)
        .map((d) => Number(d.mes));

      if (mesesConDatos.length > 0) {
        limiteMesDetectado = Math.max(...mesesConDatos);
        // Guardamos este límite en memoria para cuando solo se consulte equipo médico
        window.ultimoLimiteMesDetectado = limiteMesDetectado;
      }
    }

    // 3. Si SOLO se cargó Equipo Médico (datosDinamicos está vacío):
    if (!limiteMesDetectado) {
      // a) Usamos el último límite dinámico guardado en la sesión
      if (window.ultimoLimiteMesDetectado) {
        limiteMesDetectado = window.ultimoLimiteMesDetectado;
      } else {
        // b) O leemos cuántos meses están visibles actualmente en el DOM
        const checksVisibles = document.querySelectorAll(".mes-check");
        limiteMesDetectado = checksVisibles.length > 0 ? checksVisibles.length : 8; // Default defensivo (ej. 8 para el año en curso)
      }
    }

    // 4. Renderizar los badges de meses en la interfaz con el límite dinámico correcto
    if (typeof window.renderizarMesesGrafica === "function") {
      window.renderizarMesesGrafica(limiteMesDetectado);
    }
  }

  // =========================
  // DRAG INDICADORES
  // =========================
  function initDraggableIndicadores() {
    const items = document.querySelectorAll(".indicador-item");

    items.forEach((el) => {
      el.draggable = true;

      const ind = el.dataset.ind;

      if (!ind) return;

      el.addEventListener("dragstart", (e) => {
        const data = {
          type: "indicador",
          value: ind,
          sub: el.dataset.sub || "general",
          nombre: el.innerText.trim(),
        };

        e.dataTransfer.setData(
          "application/json",
          JSON.stringify(data)
        );
      });
    });
  }

  // =========================
  // BUSCADOR
  // =========================
  const searchInput = document.getElementById("searchUnidad");

  if (searchInput) {

    searchInput.addEventListener("input", (e) => {

      const filtro = e.target.value.toLowerCase().trim();

      const filtradas = todasUnidades.filter((u) => {

        return (
          u.nombre_unidad.toLowerCase().includes(filtro) ||
          u.clues.toLowerCase().includes(filtro)
        );

      });


      renderListaUnidades(filtradas);


      // Abrir categorías cuando se está buscando
      document.querySelectorAll(".sub-acordeon").forEach(acordeon => {

        if (filtro !== "") {
          acordeon.open = true;
        } else {
          acordeon.open = false;
        }

      });

    });

  }


  // =========================
  // BUSCADOR SINERHIAS
  // =========================

  const searchSinerhias = document.getElementById("searchSinerhias");


  if (searchSinerhias) {

    searchSinerhias.addEventListener("input", (e) => {

      const filtro = e.target.value.toLowerCase().trim();


      // Buscamos dentro del acordeón SINERHIAS completo
      const contenedor = searchSinerhias
        .closest(".acordeon-indicadores");


      const indicadores = contenedor.querySelectorAll(
        ".indicador-item"
      );


      indicadores.forEach(item => {

        const texto = (
          item.textContent +
          " " +
          item.dataset.ind
        )
          .toLowerCase()
          .trim();


        if (texto.includes(filtro)) {

          item.style.display = "";

        } else {

          item.style.display = "none";

        }

      });



      // Abrir sub-acordeones donde existan resultados
      const detalles = contenedor.querySelectorAll(
        "details"
      );


      detalles.forEach(detalle => {

        const visibles = detalle.querySelectorAll(
          ".indicador-item:not([style*='display: none'])"
        );


        if (filtro !== "" && visibles.length > 0) {

          detalle.open = true;

        }


        if (filtro === "") {

          detalle.open = false;

          indicadores.forEach(item => {
            item.style.display = "";
          });

        }

      });



      // ==============================
      // IR AL PRIMER RESULTADO
      // ==============================

      if (filtro !== "") {

        const primerResultado = contenedor.querySelector(
          ".indicador-item:not([style*='display: none'])"
        );


        if (primerResultado) {


          setTimeout(() => {


            primerResultado.scrollIntoView({
              behavior: "smooth",
              block: "center"
            });


            // Resaltar resultado encontrado
            primerResultado.classList.add(
              "resultado-encontrado"
            );

            setTimeout(() => {

              primerResultado.classList.remove(
                "resultado-encontrado"
              );

            }, 1500);


          }, 300);


        }

      }


    });

  }

  // =========================
  // DROP ZONE CON DEPURACIÓN
  // =========================
  const dropZone = document.getElementById("dropZone");

  if (dropZone) {
    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("drag-over");
    });

    dropZone.addEventListener("dragenter", (e) => {
      e.preventDefault();
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("drag-over");
    });

    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("drag-over");

      const raw = e.dataTransfer.getData("application/json") || e.dataTransfer.getData("text");
      if (!raw) return;

      let data;
      try {
        data = JSON.parse(raw);
      } catch {
        return;
      }

      // =========================
      // UNIDADES (INDIVIDUAL)
      // =========================
      if (data.type === "unidad") {
        if (!unidadesSeleccionadas.has(data.value)) {
          unidadesSeleccionadas.add(data.value);
          if (typeof addBadge === "function") {
            const nombreLimpio = typeof limpiarNombreUnidad === "function" ? limpiarNombreUnidad(data.nombre) : data.nombre;
            addBadge(nombreLimpio, "unidad", data.value);
          }
        }
      }

      // =========================
      // UNIDADES (GRUPO / ABANICO: ACUMULADO)
      // =========================
      if (data.type === "grupo_unidades" && Array.isArray(data.items)) {
        // 1. Agregar todos los IDs del grupo al Set
        data.items.forEach((item) => {
          unidadesSeleccionadas.add(item.value);
        });

        // 2. Nombre representativo del grupo para el Badge
        let etiquetaGrupo = "";
        if (data.grupo === "TODAS") {
          etiquetaGrupo = "🏥 TODAS LAS UNIDADES (" + data.items.length + ")";
        } else {
          etiquetaGrupo = "🏥 GRUPO " + data.grupo + " (" + data.items.length + " Unidades)";
        }

        // 3. Crear UN SOLO BADGE ACUMULADO para todo el grupo
        if (typeof addBadge === "function") {
          const idGrupo = "GRUPO_" + data.grupo;
          addBadge(etiquetaGrupo, "grupo_unidad", idGrupo);
        }
      }

      // =========================
      // INDICADORES
      // =========================
      if (data.type === "indicador") {
        if (!indicadoresSeleccionados.has(data.value)) {
          indicadoresSeleccionados.add(data.value);
          window.ultimoIndicadorArrastrado = data.value;

          const el = document.querySelector(`.indicador-item[data-ind="${data.value}"]`);
          const texto = el ? el.innerText.trim() : (data.nombre || data.value);

          if (typeof addBadge === "function") {
            addBadge(texto, "indicador", data.value);
          }
        }
      }

      if (typeof cargarGrafica === "function") {
        cargarGrafica();
      }
    });
  }

  // =========================
  // BADGES
  // =========================
  function addBadge(texto, tipo, value) {
    const placeholder = dropZone.querySelector(".placeholder-text");

    if (placeholder) placeholder.style.display = "none";

    const span = document.createElement("span");
    span.className = "badge-item";
    span.dataset.tipo = tipo;
    span.dataset.value = value;
    span.dataset.sinDatos = "false";

    // ==========================================================
    // 🎨 PALETA DE COLORES Y CONTRASTE POR TIPO DE ELEMENTO
    // ==========================================================
    let estiloFondoTexto = "";
    let icono = "";

    if (tipo === "grupo_unidad") {
      // 🏥 GRUPO (TODAS/42 UNIDADES): Fondo claro (#f1f5f9) con LETRA NEGRA (#0f172a)
      estiloFondoTexto = "background-color: #f1f5f9 !important; color: #0f172a !important; border: 1px solid #cbd5e1 !important;";
      icono = '<i class="bi bi-collection-fill me-1" style="color: #0f172a !important;"></i>';

    } else if (tipo === "unidad") {
      // 🏥 UNIDAD INDIVIDUAL: Fondo azul suave con LETRA OSCURA (#1e293b)
      estiloFondoTexto = "background-color: #e0f2fe !important; color: #0369a1 !important; border: 1px solid #bae6fd !important;";
      icono = '<i class="bi bi-hospital me-1" style="color: #0369a1 !important;"></i>';

    } else if (tipo === "indicador") {
      // 📊 INDICADOR: Fondo azul oscuro/institucional con LETRA BLANCA (#ffffff)
      if (indicadoresSinDatos.has(value)) {
        span.classList.add("indicador-sin-datos");
        estiloFondoTexto = "background-color: #fef2f2 !important; color: #dc2626 !important; border: 1px solid #fecaca !important;";
      } else {
        estiloFondoTexto = "background-color: #1e40af !important; color: #ffffff !important; border: 1px solid #1e3a8a !important;";
      }
      icono = '<i class="bi bi-graph-up me-1" style="color: inherit;"></i>';
    }

    // Aplicar estilos generales de contenedor
    span.style.cssText = `${estiloFondoTexto} font-weight: 600; padding: 5px 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; margin-right: 6px; margin-bottom: 6px; font-size: 13px;`;

    // HTML del badge con herencia de color para que el texto NO se pierda
    span.innerHTML = `
    ${icono}
    <span style="color: inherit !important;">${texto}</span>
    <span class="close-btn" style="color: inherit !important; font-weight: bold; margin-left: 6px; cursor: pointer; opacity: 0.8;">&times;</span>
  `;

    // ❌ EVENTO DE ELIMINACIÓN DEL BADGE
    span.querySelector(".close-btn").onclick = () => {
      if (tipo === "unidad") {
        unidadesSeleccionadas.delete(value);
      } else if (tipo === "grupo_unidad") {
        // Si se borra el grupo (ej. TODAS), limpiamos las 42 unidades
        unidadesSeleccionadas.clear();
        if (window.grupoSeleccionadoActual) {
          window.grupoSeleccionadoActual = null;
        }
      } else if (tipo === "indicador") {
        indicadoresSeleccionados.delete(value);
      }

      span.remove();

      if (
        dropZone.querySelectorAll(".badge-item").length === 0 &&
        placeholder
      ) {
        placeholder.style.display = "block";
      }

      cargarGrafica();
    };

    dropZone.appendChild(span);
  }



  // Helper global para destruir cualquier tipo de gráfica
  function destruirTodasLasGraficas() {
    if (typeof chart !== "undefined" && chart) {
      chart.destroy();
      chart = null;
    }
    if (typeof instanciasCharts !== "undefined" && Array.isArray(instanciasCharts)) {
      instanciasCharts.forEach((c) => c && c.destroy());
      instanciasCharts = [];
    }
  }


  function cargarGrafica() {

    // 1. Si hay selecciones directas en el mapa, ajustar visibilidad de toggles secundarios
    if (unidadesSeleccionadas.size > 0) {
      mostrarTodasUnidades = false;

      const swUnidades = document.getElementById("switchUnidades");
      if (swUnidades) swUnidades.checked = false;

      const contenedorTipologia = document.getElementById("contenedorTipologia");
      if (contenedorTipologia) contenedorTipologia.style.display = "none";

      const contenedorAcumular = document.getElementById("contenedorAcumularTipologia");
      if (contenedorAcumular) contenedorAcumular.style.display = "none";
    }

    // 🔑 2. DETECTAR TODOS LOS GRUPOS PRESENTES EN EL DROPZONE / SELECCIÓN
    const badgesGrupos = Array.from(
      document.querySelectorAll(".badge-grupo-unidad, [data-tipo='grupo_unidad'], [data-tipo='grupo_unidades']")
    );

    const hayGrupos = badgesGrupos.length > 0 || Boolean(window.grupoSeleccionadoActual);

    // 🔑 3. VALIDACIONES INICIALES
    const puedeMostrarTodas = mostrarTodasUnidades && unidadesSeleccionadas.size === 0;

    if (!puedeMostrarTodas && unidadesSeleccionadas.size === 0 && !hayGrupos) {
      destruirTodasLasGraficas();
      return;
    }

    if (indicadoresSeleccionados.size === 0) {
      destruirTodasLasGraficas();
      return;
    }

    const aniosChecked = Array.from(
      document.querySelectorAll(".anio-check:checked")
    ).map((el) => el.value);

    if (aniosChecked.length === 0) {
      destruirTodasLasGraficas();
      return;
    }

    const modoVista = document.getElementById("modoVista")?.value;
    const esAnual = modoVista === "anual";

    const params = new URLSearchParams();

    // =========================================================
    // MODO DE AGRUPACIÓN Y CONSTRUCCIÓN EXACTA DE PARÁMETROS
    // =========================================================
    if (hayGrupos) {
      params.append("modo", "acumulado");

      badgesGrupos.forEach((badge) => {
        const valGrupo = badge.dataset.value || badge.dataset.id || badge.getAttribute("value");
        if (valGrupo) {
          const idLimpio = valGrupo.replace("GRUPO_", "").toUpperCase().trim();
          params.append("grupos[]", idLimpio);

          // 🔑 ENVIAR LAS CLUES ESPECÍFICAS DE CADA GRUPO SI EXISTEN EN EL ELEMENTO
          if (badge.dataset.clues) {
            try {
              const cluesArr = JSON.parse(badge.dataset.clues);
              if (Array.isArray(cluesArr)) {
                cluesArr.forEach((c) => params.append(`grupo_${idLimpio}_clues[]`, c));
              }
            } catch (e) {
              params.append(`grupo_${idLimpio}_clues[]`, badge.dataset.clues);
            }
          }
        }
      });

      // 🔑 SI SE SELECCIONÓ UN GRUPO COMPLETO CON ARREGLO DE CLUES
      if (window.grupoSeleccionadoActual && Array.isArray(window.grupoSeleccionadoActual.items)) {
        const idGrupoActual = (window.grupoSeleccionadoActual.id || "TODAS").replace("GRUPO_", "").toUpperCase().trim();

        if (!badgesGrupos.some(b => (b.dataset.value || "").includes(idGrupoActual))) {
          params.append("grupos[]", idGrupoActual);
        }

        window.grupoSeleccionadoActual.items.forEach((item) => {
          const val = typeof item === "object" ? item.value : item;
          if (val) {
            params.append(`grupo_${idGrupoActual}_clues[]`, val);
            params.append("clues[]", val);
          }
        });
      }
    } else {
      params.append("modo", "individual");

      // Enviar selección de unidades individuales
      unidadesSeleccionadas.forEach((u) => {
        const val = typeof u === "object" ? u.value : u;
        if (val) params.append("clues[]", val);
      });
    }

    // =========================
    // TIPOLOGIA
    // =========================
    if (mostrarTodasUnidades) {
      const tipologia =
        document.querySelector("input[name='tipologia']:checked")?.value || "TODAS";
      params.append("tipologia", tipologia);
    }

    // =========================
    // INDICADORES
    // =========================
    indicadoresSeleccionados.forEach((i) => {
      params.append("indicadores[]", i);
    });

    // =========================
    // AÑOS
    // =========================
    aniosChecked.forEach((a) => {
      params.append("anios[]", a);
    });

    // =========================
    // MESES (CORREGIDO: NO FORZAR 12 MESES SI VIENE VACÍO)
    // =========================
    let mesesSeleccionados = obtenerMesesSeleccionados();

    if (esAnual) {
      params.append("meses[]", "13");
    } else if (mesesSeleccionados.length > 0) {
      // 🔑 Solo enviamos los meses si el usuario los seleccionó explícitamente en el filtro
      mesesSeleccionados.forEach((m) => {
        params.append("meses[]", m);
      });
    }


    // =========================
    // PETICIÓN HTTP (FETCH)
    // =========================
    fetch("/grafica/api/indicadores?" + params.toString())
      .then(async (r) => {
        if (r.redirected) {
          window.location.href = r.url;
          return null;
        }
        if (r.status === 401) {
          window.location.href = "/login";
          return null;
        }

        if (!r.ok) {
          const errorTexto = await r.text();

          destruirTodasLasGraficas();
          return null;
        }

        return r.json();
      })
      .then((data) => {


        if (!data || data.length === 0) {

          destruirTodasLasGraficas();
          return;
        }

        window.ultimoDataRecibido = data;

        // 🔑 1. Limitar los botones de la interfaz a los meses cargados (ej. 1 a 8 para Ene-Ago)
        sincronizarMesesUIConDatos(data);

        // 🔑 2. Dibujar la gráfica
        renderGrafica(data);

        if (window.ultimoIndicadorArrastrado && !hayGrupos) {
          validarDatosIndicadorIndividual(
            data,
            window.ultimoIndicadorArrastrado
          );
          restaurarEstadosBadges();
        }
      })
      .catch((err) => {
        console.error("Error al cargar gráfica:", err);
      });
  }


  function validarDatosIndicadorIndividual(data, indicadorId) {


    unidadesSeleccionadas.forEach((cluesId) => {


      const unidadInfo = todasUnidades.find(
        u => u.clues === cluesId
      );


      const nombreU = unidadInfo
        ? limpiarNombreUnidad(unidadInfo.nombre_unidad)
        : cluesId;



      const registros = data.filter(
        d =>
          norm(limpiarNombreUnidad(d.nombre_unidad)) ===
          norm(nombreU)
          &&
          norm(d.indicador) === norm(indicadorId)
      );



      const tieneDatos = registros.some(
        r => Number(r.valor) > 0
      );



      const clave = `${cluesId}-${indicadorId}`;



      if (!tieneDatos) {


        // ================================
        // PINTAR BADGE SIN DATOS
        // ================================

        const badge = document.querySelector(
          `.badge-item[data-tipo="indicador"][data-value="${indicadorId}"]`
        );


        if (badge) {

          indicadoresSinDatos.add(indicadorId);

          badge.classList.add("indicador-sin-datos");

          badge.dataset.sinDatos = "true";

        }



        if (!alertasMostradas.has(clave)) {
          alertasMostradas.add(clave);
          setTimeout(() => {
            alert(
              `Atención:\n\n"${nombreU}" no cuenta con datos para "${indicadorId}"`
            );
          }, 300);
        }


      }


    });


  }


  // PARTE 2

  function restaurarEstadosBadges() {

    document.querySelectorAll(".badge-item").forEach(badge => {

      if (badge.dataset.sinDatos === "true") {

        badge.classList.add("indicador-sin-datos");

      }

    });

  }



  function crearLeyendaPersonalizada(chart) {
    const contenedor = document.getElementById("leyendaPersonalizada");

    if (!contenedor) return;

    contenedor.innerHTML = "";
    const datasets = chart.data.datasets;

    // 1. Agrupar los datasets por Indicador
    const grupos = {};

    datasets.forEach((dataset, index) => {
      // Si es línea de tendencia, se omite
      if (dataset.label?.includes("Tendencia")) return;

      const nombreIndicador = (typeof obtenerNombreIndicador === "function"
        ? obtenerNombreIndicador(dataset.indicador)
        : dataset.indicador) || "General";

      if (!grupos[nombreIndicador]) {
        grupos[nombreIndicador] = [];
      }

      grupos[nombreIndicador].push({ dataset, index });
    });

    // 2. Renderizar cada bloque/grupo de indicador
    Object.keys(grupos).forEach((nombreIndicador) => {
      // Contenedor del grupo
      const bloqueGrupo = document.createElement("div");
      bloqueGrupo.classList.add("grupo-leyenda");

      // Título de la sección (Nombre del Indicador)
      const tituloGrupo = document.createElement("h6");
      tituloGrupo.textContent = `📊 ${nombreIndicador}`;
      tituloGrupo.style.width = "100%";
      tituloGrupo.style.margin = "15px 0 10px 0";
      tituloGrupo.style.paddingBottom = "4px";
      tituloGrupo.style.borderBottom = "2px solid #e9ecef";
      tituloGrupo.style.color = "#2c3e50";
      tituloGrupo.style.fontSize = "13px";
      tituloGrupo.style.fontWeight = "bold";

      bloqueGrupo.appendChild(tituloGrupo);

      // Grid para los elementos de este indicador
      const gridItems = document.createElement("div");
      gridItems.style.display = "grid";
      gridItems.style.gridTemplateColumns = "repeat(auto-fit, minmax(260px, 1fr))";
      gridItems.style.gap = "8px 15px";

      // Ordenar los items del grupo
      grupos[nombreIndicador].sort((a, b) =>
        a.dataset.label.localeCompare(b.dataset.label)
      );

      grupos[nombreIndicador].forEach(({ dataset, index }) => {
        const item = document.createElement("div");
        item.style.display = "flex";
        item.style.alignItems = "center";
        item.style.cursor = "pointer";
        item.style.fontSize = "11px";

        // 🎨 Canvas mini para replicar exacto el trazado de la gráfica
        const canvasIcon = document.createElement("canvas");
        canvasIcon.width = 36;
        canvasIcon.height = 14;
        canvasIcon.style.marginRight = "8px";
        canvasIcon.style.flexShrink = "0";

        const ctxIcon = canvasIcon.getContext("2d");
        const rawColor = dataset.borderColor || dataset.backgroundColor;
        const colorFinal = Array.isArray(rawColor) ? rawColor[0] : rawColor;

        ctxIcon.beginPath();
        ctxIcon.strokeStyle = colorFinal;
        ctxIcon.lineWidth = 3;

        // Patrón de línea exacto
        if (dataset.borderDash && dataset.borderDash.length > 0) {
          ctxIcon.setLineDash(dataset.borderDash);
        } else {
          ctxIcon.setLineDash([]);
        }

        ctxIcon.moveTo(0, 7);
        ctxIcon.lineTo(36, 7);
        ctxIcon.stroke();

        // 🔑 TEXTO CORREGIDO: Formatea la Unidad + Año para evitar repeticiones genéricas
        const texto = document.createElement("span");

        const unidadTexto = typeof nombreUnidad === "function"
          ? nombreUnidad(dataset.unidad || "TODAS")
          : (dataset.unidad || "Todas las Unidades");

        const anioTexto = dataset.anio ? `(${dataset.anio})` : "";

        // Muestra: "Todas Las Unidades (42) (2026)" o la Unidad Específica + Año
        texto.textContent = `${unidadTexto} ${anioTexto}`.trim();
        texto.style.color = "#495057";

        // Estado inicial si está oculto
        if (!chart.isDatasetVisible(index)) {
          texto.style.textDecoration = "line-through";
          texto.style.opacity = "0.4";
          canvasIcon.style.opacity = "0.4";
        }

        // Evento Click para ocultar/mostrar
        item.onclick = () => {
          chart.setDatasetVisibility(index, !chart.isDatasetVisible(index));
          chart.update();

          const vis = chart.isDatasetVisible(index);
          texto.style.textDecoration = vis ? "none" : "line-through";
          texto.style.opacity = vis ? "1" : "0.4";
          canvasIcon.style.opacity = vis ? "1" : "0.4";
        };

        item.appendChild(canvasIcon);
        item.appendChild(texto);
        gridItems.appendChild(item);
      });

      bloqueGrupo.appendChild(gridItems);
      contenedor.appendChild(bloqueGrupo);
    });
  }


  function renderGrafica(data) {
    // 🛡️ Guardacostas para data
    if (!data && window.ultimoDataRecibido) {
      data = window.ultimoDataRecibido;
    }
    if (!data) return;
    window.ultimoDataRecibido = data;

    // Helper auxiliar de conversión y normalización segura
    const str = (val) => (val || "").toString();
    const norm = (s) =>
      str(s)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim()
        .replace(/\s+/g, "_");

    // 1. Lectura de radios y controles
    const radioSeleccionado = document.querySelector('input[name="modoVista"]:checked');
    const modoVistaSeleccionado = radioSeleccionado ? radioSeleccionado.value : "combinada";

    const modoVistaAnual = document.getElementById("modoVista")?.value;
    const esVistaAnual = modoVistaAnual === "anual";
    const mesesSeleccionados = typeof obtenerMesesSeleccionados === "function" ? obtenerMesesSeleccionados() : [];

    const sw = document.getElementById("switchUnidades");
    if (sw && typeof unidadesSeleccionadas !== "undefined" && unidadesSeleccionadas.size > 0) {
      sw.checked = false;
      if (typeof mostrarTodasUnidades !== "undefined") mostrarTodasUnidades = false;
    }

    const mesesLabels = [
      "Ene", "Feb", "Mar", "Abr", "May", "Jun",
      "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"
    ];

    const tipoOriginal = document.getElementById("tipoGrafica")?.value || "line";

    const tituloElt = document.getElementById("tituloGrafica");
    if (tituloElt) {
      tituloElt.innerText = esVistaAnual
        ? "Comparativo Anual"
        : "Tendencia Mensual";
    }

    const tipoChartJS =
      tipoOriginal === "area" || tipoOriginal === "scatter"
        ? "line"
        : tipoOriginal;

    // =========================================================
    // FILTRADO ROBUSTO DE DATOS PARA GRUPOS
    // =========================================================
    let datosGrafica = data;

    const registrosTotales = data.filter((d) =>
      str(d.clues).toUpperCase() === "TOTAL" ||
      str(d.clues).startsWith("GRUPO_") ||
      str(d.nombre_unidad).toUpperCase() === "TOTAL GRUPO" ||
      str(d.nombre_unidad).toUpperCase() === "TOTAL GENERAL" ||
      str(d.nombre_unidad).toUpperCase().includes("TODAS LAS UNIDADES")
    );

    if (registrosTotales.length > 0) {
      // 🔑 Mantenemos las filas consolidadas Y TAMBIÉN los insumos/indicadores componentes devueltos
      const indicadoresEnTotales = new Set(registrosTotales.map(d => norm(d.indicador)));

      datosGrafica = data.filter((d) => {
        const esTotal =
          str(d.clues).toUpperCase() === "TOTAL" ||
          str(d.clues).startsWith("GRUPO_") ||
          str(d.nombre_unidad).toUpperCase().includes("TOTAL");

        // Si no es un registro explícito "TOTAL", pero su indicador viene en la respuesta,
        // significa que es un insumo componente traído para el grupo: NO LO DESCARTAMOS.
        return esTotal || !indicadoresEnTotales.has(norm(d.indicador));
      });

      if (datosGrafica.length === 0) datosGrafica = registrosTotales;
    }

    // =========================
    // CALCULO ROBUSTO DE ETIQUETAS X
    // =========================
    let etiquetasX = [];
    let mesesBase = [];

    if (esVistaAnual) {
      etiquetasX = ["Total Anual"];
    } else if (mesesSeleccionados.length > 0) {
      mesesBase = mesesSeleccionados;
      etiquetasX = mesesBase.map((m) => mesesLabels[m - 1]);
    } else {
      const mesesConProduccionReal = datosGrafica
        .filter((d) => Number(d.valor || 0) > 0 && Number(d.mes) >= 1 && Number(d.mes) <= 12)
        .map((d) => Number(d.mes));

      const ultimoMesReal = mesesConProduccionReal.length > 0 ? Math.max(...mesesConProduccionReal) : 12;

      mesesBase = Array.from({ length: ultimoMesReal }, (_, i) => i + 1);
      etiquetasX = mesesBase.map((m) => mesesLabels[m - 1]);
    }

    // =========================
    // GENERACIÓN DE COMBOS
    // =========================
    let combos = [];

    if (mostrarTodasUnidades && typeof acumularPorTipologia !== "undefined" && acumularPorTipologia) {
      combos = [
        ...new Set(
          datosGrafica.map((d) => {
            const tip = str(d.tipologia || "OTRO").trim().toUpperCase();
            return `${norm(d.indicador)}|||${d.anio}|||TIPOLOGIA_${tip}`;
          })
        ),
      ];
    } else {
      combos = [
        ...new Set(
          datosGrafica.map((d) => {
            const etiquetaEntidad = d.nombre_unidad || d.clues || "unidad";
            return `${norm(d.indicador)}|||${d.anio}|||${norm(etiquetaEntidad)}`;
          })
        ),
      ];
    }

    const mostrarTendencia = document.getElementById("switchTendencia")?.checked || false;

    const esIndicadorRazon = (ind) => {
      const i = norm(ind);
      return i.includes("mortalidad") || i.includes("porcentaje") || i.includes("prom") || i.includes("indice") || i.includes("interv");
    };

    // 🎨 PALETA DE COLORES VIBRANTES Y ALTAMENTE CONTRASTANTES
    const PALETA_COLORES_DISTINTOS = [
      "#2563eb", "#dc2626", "#16a34a", "#d97706", "#9333ea",
      "#0891b2", "#e11d48", "#059669", "#ca8a04", "#7c3aed"
    ];

    // =========================
    // DATASETS (CONSTRUCCIÓN CON FILTRADO FLEXIBLE PARA GRUPOS)
    // =========================
    const datasets = combos.flatMap((c, comboIndex) => {
      const [indicadorNom, anioNom, unidadLimpia] = c.split("|||");
      let valores = [];
      const esModoTipologia = unidadLimpia.startsWith("TIPOLOGIA_");
      const claveTipologia = esModoTipologia ? unidadLimpia.replace("TIPOLOGIA_", "") : null;

      if (!esVistaAnual) {
        const registros = datosGrafica.filter((d) => {
          const coincideInd = norm(d.indicador) === norm(indicadorNom);
          const coincideAnio = String(d.anio) === String(anioNom);
          const esMesValido = Number(d.mes) >= 1 && Number(d.mes) <= 12;

          if (!coincideInd || !coincideAnio || !esMesValido) return false;

          if (esModoTipologia) {
            return str(d.tipologia || "OTRO").trim().toUpperCase() === claveTipologia;
          } else {
            const entReg = norm(d.nombre_unidad || d.clues);
            const cluesReg = norm(d.clues);

            // 🔑 FLEXIBILIDAD EN GRUPOS/TOTALES:
            // Acepta coincidencia exacta de entidad O registros consolidados (TOTAL GRUPO / GRUPO_...)
            const esGrupoOTotal = unidadLimpia.includes("total") || unidadLimpia.includes("grupo") || unidadLimpia === "todas";

            if (esGrupoOTotal) {
              return (
                entReg === unidadLimpia ||
                cluesReg === unidadLimpia ||
                entReg.includes("total") ||
                cluesReg.includes("total") ||
                cluesReg.startsWith("grupo_")
              );
            }

            return entReg === unidadLimpia || cluesReg === unidadLimpia;
          }
        });

        const mapaMeses = {};

        registros.forEach((r) => {
          const m = Number(r.mes);
          const val = Number(r.valor || 0);

          if (!(m in mapaMeses) || str(r.clues).toUpperCase().startsWith("GRUPO_") || str(r.clues).toUpperCase() === "TOTAL") {
            mapaMeses[m] = val;
          }
        });

        valores = mesesBase.map((m) => (m in mapaMeses ? mapaMeses[m] : 0));
      } else {
        const registros = datosGrafica.filter((d) => {
          const coincideInd = norm(d.indicador) === norm(indicadorNom);
          const coincideAnio = String(d.anio) === String(anioNom);
          const esMes13 = Number(d.mes) === 13;

          if (!coincideInd || !coincideAnio || !esMes13) return false;

          if (esModoTipologia) {
            return str(d.tipologia || "OTRO").trim().toUpperCase() === claveTipologia;
          } else {
            const entReg = norm(d.nombre_unidad || d.clues);
            const cluesReg = norm(d.clues);
            return (
              entReg === unidadLimpia ||
              cluesReg === unidadLimpia ||
              (unidadLimpia.includes("total") && (entReg.includes("total") || cluesReg.includes("total")))
            );
          }
        });

        let totalAnual = 0;
        if (registros.length > 0) {
          const regConsolidado = registros.find(r => str(r.clues).toUpperCase() === "TOTAL" || norm(r.nombre_unidad).includes("total"));
          if (regConsolidado) {
            totalAnual = Number(regConsolidado.valor || 0);
          } else if (esIndicadorRazon(indicadorNom)) {
            totalAnual = registros.reduce((acc, r) => acc + Number(r.valor || 0), 0) / registros.length;
          } else {
            totalAnual = registros.reduce((acc, r) => acc + Number(r.valor || 0), 0);
          }
        }
        valores = [totalAnual];
      }

      if (valores.length === 0) return [];

      const colorBase = PALETA_COLORES_DISTINTOS[comboIndex % PALETA_COLORES_DISTINTOS.length];

      const estilosLinea = [
        [], [6, 6], [2, 3], [12, 4, 2, 4], [8, 4]
      ];

      const listaIndicadores = typeof indicadoresSeleccionados !== "undefined" ? Array.from(indicadoresSeleccionados) : [];
      const idxIndicador = listaIndicadores.indexOf(indicadorNom);
      const estiloDash = estilosLinea[Math.max(0, idxIndicador) % estilosLinea.length];

      const regEjemplo = datosGrafica.find(d => norm(d.nombre_unidad || d.clues) === unidadLimpia);
      let nombreEntidadMostrar = esModoTipologia
        ? `ACUMULADO ${claveTipologia}`
        : (regEjemplo ? regEjemplo.nombre_unidad : unidadLimpia.toUpperCase());

      if (!nombreEntidadMostrar || nombreEntidadMostrar.toUpperCase() === "TODAS" || nombreEntidadMostrar.toUpperCase() === "TOTAL GENERAL") {
        nombreEntidadMostrar = "Todas las Unidades";
      }

      const indNombre = typeof obtenerNombreIndicador === "function"
        ? obtenerNombreIndicador(indicadorNom)

            ? colorBase + "4D"

        fill: tipoOriginal === "area",

        pointRadius: tipoOriginal === "scatter" ? 6 : 4,

      };

    // Opciones de Chart.js

    // ===================================================
    // RENDERIZADO FINAL Y LEYENDA INFERIOR
    // ===================================================
    const contenedor = document.getElementById("contenedorGraficas");

    if (!contenedor) return;

    if (typeof chart !== "undefined" && chart) {

  function calcularTendencia(data) {
    if (!data || data.length < 2) return [];

    // 1. Filtrar solo los meses que tienen datos reales (excluyendo ceros/nulls de meses sin capturar)
    const puntosValidos = [];

    data.forEach((val, i) => {
      const y = Number(val);
      // Si el valor es mayor a 0 y válido, entra al cálculo de la regresión
      if (!isNaN(y) && val !== null && val !== undefined && y > 0) {
        puntosValidos.push({ x: i, y: y });
      }
    });

    // Si hay menos de 2 meses con información real, no calculamos tendencia
    const n = puntosValidos.length;
    if (n < 2) return [];

    // 2. Sumatorias basadas únicamente en datos reales
    let sumX = 0,
      sumY = 0,
      sumXY = 0,
      sumXX = 0;

    for (let i = 0; i < n; i++) {
      const { x, y } = puntosValidos[i];
      sumX += x;
      sumY += y;
      sumXY += x * y;
      sumXX += x * x;
    }

    const denominator = (n * sumXX - sumX * sumX);
    if (denominator === 0) return [];

    const m = (n * sumXY - sumX * sumY) / denominator;
    const b = (sumY - m * sumX) / n;

    // 3. Generar la recta proyectada: los meses no capturados devuelven null
    // para evitar que la línea caiga hacia los meses vacíos
    return data.map((val, i) => {
      const y = Number(val);
      if (!isNaN(y) && val !== null && val !== undefined && y > 0) {
        return Number((m * i + b).toFixed(2));
      }
      return null;
    });
  }

      if (val) params.append("clues[]", val);
    });

    // =========================
    // INDICADORES SELECCIONADOS
    // =========================
    const indicadoresSeleccion =
      typeof indicadoresSeleccionados !== "undefined" && indicadoresSeleccionados.size > 0
        ? Array.from(indicadoresSeleccionados)
        : [];

    indicadoresSeleccion.forEach((i) => {
      params.append("indicadores[]", i);
    });

    // =========================
    // MESES 🔥 FIX CRÍTICO
    // =========================
    if (mesesSeleccionados.length === 0 && !esAnual) {
      alert("Selecciona al menos un mes.");
      resetBotonExcel();
      return;
    }

    mesesSeleccionados.forEach((m) => {
      params.append("meses[]", m);
    });

    if (esAnual) {
      params.append("meses[]", "13");
    }

    // =========================
    // FETCH
    // =========================
    let dataTotal = [];

    try {

      const res = await fetch("/grafica/api/indicadores?" + params.toString());
      dataTotal = await res.json();

      if (!dataTotal.length) {
        alert("No hay datos para descargar.");
        resetBotonExcel();
        return;
      }
    } catch (e) {
      console.error(e);
      alert("Error al conectar con el servidor.");
      resetBotonExcel();
      return;
    }

    // =========================
    // FILTRADO Y MATRIZ EXCEL
    // =========================
    const columnasSet = new Set();
    dataTotal.forEach((d) => {
      if (d.indicador) columnasSet.add(d.indicador.trim());
    });

    const columnas = [];
    columnasDeseadas.forEach((c) => {
      if (columnasSet.has(c)) columnas.push(c);
    });

    columnasEquipo.forEach((c) => {
      if (columnasSet.has(c) && indicadoresSeleccion.includes(c)) {
        columnas.push(c);
      }
    });

    const filas = dataTotal.filter((d) => {
      const mes = parseInt(d.mes);
      return esAnual ? mes === 13 : mesesSeleccionados.map(Number).includes(mes);
    });

    const matriz = {};

    filas.forEach((d) => {
      // Ignorar filas residuales de 'TOTAL GRUPO' en caso de que vinieran en el array
      if (d.clues && d.clues.startsWith("GRUPO_")) return;

      const unidad = d.nombre_unidad || "SIN UNIDAD";
      const anio = d.anio;
      const mesNum = parseInt(d.mes);

      const mesTexto =
        mesNum === 13
          ? formatearRangoMeses(mesesSeleccionados, mesesLabels)
          : mesesLabels[mesNum - 1];

      const clues = d.clues || "";
      const key = `${unidad}|${anio}|${mesTexto}`;

      if (!matriz[key]) {
        matriz[key] = {
          clues: clues,
          unidad,
          anio,
          mes: mesTexto,
          valores: {}
        };
      } else if (!matriz[key].clues && clues) {
        matriz[key].clues = clues;
      }

      const indicador = d.indicador.trim();
      const valor = parseFloat(d.valor) || 0;

      matriz[key].valores[indicador] = valor;
    });

    // =========================
    // EXPORTAR
    // =========================
    exportarXLSX(matriz, columnas);
    resetBotonExcel();
  }

  // Formatear los meses para la descarga

  function formatearRangoMeses(mesesSeleccionados, mesesLabels) {


    const meses = [...mesesSeleccionados].map(Number).sort((a, b) => a - b);

    if (meses.length === 0) return "";

    // Verificar si son consecutivos
    let consecutivos = true;

    for (let i = 1; i < meses.length; i++) {
      if (meses[i] !== meses[i - 1] + 1) {
        consecutivos = false;
        break;
      }
    }

    // Si solo hay un mes
    if (meses.length === 1) {
      return mesesLabels[meses[0] - 1];
    }

    // Si son consecutivos
    if (consecutivos) {
      return `${mesesLabels[meses[0] - 1]} - ${mesesLabels[meses.length - 1]}`;
    }

    // Si NO son consecutivos
    return meses.map((m) => mesesLabels[m - 1]).join(", ");
  }

  function exportarXLSX(matriz, columnas) {

    const data = [];

    const filaCategorias = ["", "", "", ""];
    const headers = ["Clues", "Unidad", "Año", "Mes"];
    const merges = [];
    const grupoPorColumna = {};

    let colActual = 4;

    Object.entries(grupos).forEach(([nombreGrupo, indicadores]) => {
      const visibles = indicadores.filter(i => columnas.includes(i));
      if (!visibles.length) return;

      filaCategorias.push(nombreGrupo);

      for (let i = 1; i < visibles.length; i++) {
        filaCategorias.push("");
      }

      visibles.forEach(ind => {
        headers.push(nombresColumnas[ind] || ind);
        grupoPorColumna[headers.length - 1] = nombreGrupo;
      });

      merges.push({
        s: { r: 0, c: colActual },
        e: { r: 0, c: colActual + visibles.length - 1 }
      });

      colActual += visibles.length;
    });

    data.push(filaCategorias);
    data.push(headers);

      "PROCEDIMIENTOS QUIRURGICOS FUERA DE QUIROFANO": { oscuro: "8E7CC3", claro: "EDE7F6" },
      "TOTAL DE PROCEDIMIENTOS QUIRURGICOS DENTRO Y FUERA DE QUIROFANO": { oscuro: "5E35B1", claro: "E8EAF6" },
      "EGRESOS POR DEFUNCIONES": { oscuro: "7F6000", claro: "FFF2CC" },
      "PORCENTAJE DE OCUPACION": { oscuro: "00838F", claro: "D9F2F2" },
      "INDICADORES DE HOSPITALIZACION": { oscuro: "0B6E4F", claro: "DDEFE8" },
      "INFRAESTRUCTURA (SINERHIAS)": { oscuro: "44546A", claro: "D9E2F3" },
      "EQUIPO MEDICO": { oscuro: "B45F06", claro: "FCE4D6" }
    };

    // -------------------------------------------------------------
    // AJUSTE AQUÍ: Detectar fila por Columna A (TOTAL) o Columna B (TOTAL GENERAL)
    // -------------------------------------------------------------
    const filasTotales = new Set();
    Object.keys(ws).forEach((cell) => {
      if (cell.startsWith("!")) return;
      const pos = XLSX.utils.decode_cell(cell);

      const valorStr = String(ws[cell].v || "").trim().toUpperCase();

      // pos.c === 0 (Columna A - CLUES) || pos.c === 1 (Columna B - Unidad)
      if (
        (pos.c === 0 && ws[cell].v === "TOTAL") ||
        (pos.c === 1 && ws[cell].v === "TOTAL GENERAL")
      ) {
        filasTotales.add(pos.r);
      }
    });
    // -------------------------------------------------------------

    Object.keys(ws).forEach((cell) => {
      if (cell.startsWith("!")) return;

      const pos = XLSX.utils.decode_cell(cell);
      if (!ws[cell].s) ws[cell].s = {};

      // Centrado general
      ws[cell].s.alignment = {
        horizontal: "center",
        vertical: "center"
      };

      // Fila categorías (Fila 0)
      if (pos.r === 0) {
        const grupo = ws[cell].v;
        if (coloresGrupos[grupo]) {
          ws[cell].s.font = { bold: true, color: { rgb: "FFFFFF" } };
          ws[cell].s.fill = { fgColor: { rgb: coloresGrupos[grupo].oscuro } };
        }
      }

      // Encabezados (Fila 1)
      if (pos.r === 1) {
        ws[cell].s.font = { bold: true };
        ws[cell].s.alignment = { horizontal: "center", vertical: "center", wrapText: true };

        if (pos.c <= 3) {
          ws[cell].s.fill = { fgColor: { rgb: "0F243E" } };
          ws[cell].s.font = { bold: true, color: { rgb: "FFFFFF" } };
        } else {
          const grupo = grupoPorColumna[pos.c];
          if (grupo && coloresGrupos[grupo]) {
            ws[cell].s.fill = { fgColor: { rgb: coloresGrupos[grupo].claro } };
            ws[cell].s.font = { bold: true };
          }
        }
      }

      // Alinear texto de la columna unidad a la izquierda (excepto encabezados)
      if (pos.c === 1 && pos.r > 1) {
        ws[cell].s.alignment = { horizontal: "left", vertical: "center" };
      }

      // Fila de Datos General (Filas mayores a 1)
      if (pos.r > 1) {

        // -------------------------------------------------------------
        // NUEVO: Si la fila pertenece al conjunto de totales, la pintamos de GRIS
        // -------------------------------------------------------------
        if (filasTotales.has(pos.r)) {
          ws[cell].s.fill = {
            fgColor: { rgb: "D9D9D9" } // Gris intermedio, resalta excelente sin saturar
          };
          ws[cell].s.font = {
            ...(ws[cell].s.font || {}),
            bold: true,
            color: { rgb: "000000" } // Texto negro sobre el fondo gris
          };
        }
        // -------------------------------------------------------------

        // Formatos numéricos y negritas condicionales
        if (typeof ws[cell].v === "number") {
          if (pos.c === 2) {
            ws[cell].z = "0";
            return;
          }

          const indicador = columnas[pos.c - 4];

          if (columnasNegritas.includes(indicador)) {
            ws[cell].s.font = {
              ...(ws[cell].s.font || {}),
              bold: true
            };
          }

          if (columnasPorcentaje.includes(indicador)) {
            ws[cell].z = '0.00"%"';
          } else if (!columnasSinFormato.includes(indicador)) {
            ws[cell].z = "#,##0";
          }
        }
      }
    });

    // =========================
    // ALTURA FILAS
    // =========================
    ws["!rows"] = [
      { hpt: 25 }, // Categorías
      { hpt: 40 }  // Encabezados
    ];

    // =========================
    // ANCHO COLUMNAS
    // =========================
    ws["!cols"] = headers.map((h) => ({
      wch: Math.max(String(h).length + 5, 15)
    }));

    // =========================
    // EXPORTAR
    // =========================
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Reporte IH");
    XLSX.writeFile(wb, `Reporte_IH_${Date.now()}.xlsx`);
  }



  function limpiarTodo() {
    // 1. Vaciar los Sets de selección y reiniciar variables globales de estado
    unidadesSeleccionadas.clear();
    indicadoresSeleccionados.clear();
    avisosMostrados.clear();
    alertasMostradas.clear();
    indicadoresSinDatos.clear();

    // 🔑 REINICIO DE ESTADOS Y MEMORIA GLOBAL DE MESES
    window.ultimoIndicadorArrastrado = null;
    window.ultimoDataRecibido = null;
    window.grupoSeleccionadoActual = null;
    window.ultimoLimiteMesDetectado = null; // 👈 Borra el último límite detectado para evitar arrastrar cortes anteriores

    mostrarTodasUnidades = false;
    tipologiaSeleccionada = "TODAS";

    // 2. Limpiar visualmente la Drop Zone
    const dropZone = document.getElementById("dropZone");
    const placeholder = dropZone ? dropZone.querySelector(".placeholder-text") : null;

    const badges = document.querySelectorAll(".badge-item");
    badges.forEach((b) => b.remove());

    if (placeholder) {
      placeholder.style.display = "block";
    }

    // 3. Destruir TODAS las gráficas de Chart.js
    if (typeof chart !== "undefined" && chart) {
      chart.destroy();
      chart = null;
    }

    if (Array.isArray(instanciasCharts)) {
      instanciasCharts.forEach((c) => c && c.destroy());
      instanciasCharts = [];
    }

    // 3.1 Restructurar el contenedor y limpiar leyenda
    const contenedor = document.getElementById("contenedorGraficas");
    if (contenedor) {
      contenedor.style.width = "100%";
      contenedor.className = "w-100 col-12";
      contenedor.innerHTML = `
      <div class="grafica-container w-100" style="height: 380px; position: relative; width: 100%;">
        <canvas id="grafica" style="width: 100%; height: 100%;"></canvas>
      </div>
      <div id="leyendaPersonalizada" class="mt-3 w-100"></div>
    `;
    }

    // 4. Reset años (solo el primero)
    document.querySelectorAll(".anio-check").forEach((check, index) => {
      check.checked = index === 0;
    });

    // 🔑 4.1 Reset total de la barra de meses (Reconstruye de 1 a 12 en el DOM)
    if (typeof window.renderizarMesesGrafica === "function") {
      window.renderizarMesesGrafica(12);
    } else {
      document.querySelectorAll(".mes-check").forEach((check) => {
        check.checked = true;
      });
    }

    // 5. Reset switches visuales
    const swEtiquetas = document.getElementById("switchEtiquetas");
    if (swEtiquetas) swEtiquetas.checked = false;

    const swTendencia = document.getElementById("switchTendencia");
    if (swTendencia) swTendencia.checked = false;

    const swUnidades = document.getElementById("switchUnidades");
    if (swUnidades) swUnidades.checked = false;

    // 5.1 Reset del switch de Acumular por Tipología
    const swAcumular = document.getElementById("switchAcumularTipologia");
    if (swAcumular) swAcumular.checked = false;

    const contenedorAcumular = document.getElementById("contenedorAcumularTipologia");
    if (contenedorAcumular) {
      contenedorAcumular.style.display = "none";
    }

    // 5.2 Reset del Radio Button de Vista (Regresar a Combinada)
    const radioCombinada = document.querySelector('input[name="modoVista"][value="combinada"]');
    if (radioCombinada) radioCombinada.checked = true;

    // Ocultar las tipologías
    const contenedorTipologia = document.getElementById("contenedorTipologia");
    if (contenedorTipologia) {
      contenedorTipologia.style.display = "none";
    }

    // Dejar seleccionada la opción "Todas"
    const tipTodas = document.getElementById("tipTodas");
    if (tipTodas) {
      tipTodas.checked = true;
    }

    // 6. Limpiar resumen si existe
    const summary = document.getElementById("selection-summary");
    if (summary) summary.innerHTML = "";

    // 7. Recarga limpia (al estar vacíos los sets, destruirá gráficas y dejará el lienzo en blanco)
    if (typeof cargarGrafica === "function") {
      cargarGrafica();
    }
  }


  // ======================================================
  // INICIALIZACIÓN EXCLUSIVA DE GRAFICA.HTML
  // ======================================================
  document.addEventListener("DOMContentLoaded", () => {

    // 1. Renderizado de la estructura del área de trabajo (Meses)
    if (typeof renderizarMesesGrafica === 'function') {
      renderizarMesesGrafica(12);
    }

    // 2. Eventos de la interfaz y zona de soltado (Drag & Drop)
    if (typeof bindUIEvents === 'function') {
      bindUIEvents();
    }

    if (typeof initDraggableIndicadores === 'function') {
      initDraggableIndicadores();
    }

  });


</script>
