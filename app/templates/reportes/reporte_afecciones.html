{% extends "layout/base.html" %}

{% block content %}

<div class="main-content">
    <div class="container-fluid py-2 px-3">
        <!-- CABECERA DE LA VISTA -->
        <div class="d-flex align-items-center justify-content-between mb-2">
            <div>
                <h3 class="mb-0 fs-5 fw-bold text-dark d-flex align-items-center gap-2">
                    📊 {{ titulo }}
                </h3>
                <div id="unidadSeleccionada" class="text-muted fw-bold small mt-1" style="font-size: 12px;">
                    Todas las unidades
                </div>
            </div>
        </div>

        <!-- CONTENEDOR DINÁMICO DE TABLAS Y GRÁFICAS -->
        <div id="contenedor" class="w-100"></div>
    </div>
</div>



<script>
    /* ==========================================
       1. ACTUALIZACIÓN DE ENCABEZADO Y TÍTULOS
    ========================================== */
    function actualizarTituloUnidad() {
        const unidades = window.getUnidadesRepSeleccionadas ? window.getUnidadesRepSeleccionadas() : [];
        const servicios = window.getServiciosSeleccionados ? window.getServiciosSeleccionados() : [];
        const lbl = document.getElementById("unidadSeleccionada");

        if (!lbl) return;

        let texto = "";

        if (unidades.length === 0) {
            texto = "<b>Unidad:</b> Todas las unidades";
        } else if (unidades.length === 1) {
            texto = `<b>Unidad:</b> ${unidades[0]}`;
        } else {
            texto = `<b>Unidades:</b> ${unidades.join(", ")}`;
        }

        if (servicios.length > 0) {
            texto += `<br><b>Servicio:</b> ${servicios.join(", ")}`;
        }

        lbl.innerHTML = texto;
    }

    /* ==========================================
       2. CARGA Y CONSULTA DE DATOS (Con Debounce)
    ========================================== */
    let temporizadorMorbMort = null;

    function cargarDatos() {
        if (temporizadorMorbMort) clearTimeout(temporizadorMorbMort);

        temporizadorMorbMort = setTimeout(() => {
            const typeofVar = typeof tipo !== 'undefined' ? tipo : 'morbilidad';
            const sufijoVar = typeof sufijo !== 'undefined' ? sufijo : 'Morb';

            const anios = Array.from(
                document.querySelectorAll(`.filtro-anio-${typeofVar}:checked, .filtro-anio:checked`)
            ).map(x => x.value);

            const meses = Array.from(
                document.querySelectorAll(`.filtro-mes-${typeofVar}:checked, .filtro-mes:checked`)
            ).map(x => x.value);

            const top = document.getElementById(`filtroTop${sufijoVar}`)?.value || "";

            const unidades = window.getUnidadesRepSeleccionadas ? window.getUnidadesRepSeleccionadas() : [];
            const afecciones = window.getAfeccionesSeleccionadas ? window.getAfeccionesSeleccionadas() : [];
            const servicios = window.getServiciosSeleccionados ? window.getServiciosSeleccionados() : [];

            actualizarTituloUnidad();

            const params = new URLSearchParams();

            if (anios.length) params.append("anios", anios.join(","));
            if (meses.length) params.append("meses", meses.join(","));
            if (top) params.append("top", top);
            if (unidades.length) params.append("unidades", unidades.join(","));
            if (afecciones.length) params.append("afecciones", afecciones.join(","));
            if (servicios.length) params.append("servicios", servicios.join(","));

            fetch(`/reportes/${typeofVar}/data?${params.toString()}`)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                    return res.json();
                })
                .then(data => render(data))
                .catch(err => console.error("Error al obtener reporte:", err));
        }, 150);
    }

    /* ==========================================
       3. RENDERIZADO DE CONTENEDOR Y TABLAS
    ========================================== */
    function render(data) {
        const afecciones = window.getAfeccionesSeleccionadas ? window.getAfeccionesSeleccionadas() : [];
        const contenedor = document.getElementById("contenedor");

        if (!contenedor) return;

        contenedor.innerHTML = "";

        if (!data || data.length === 0) {
            contenedor.innerHTML = `<div class="alert alert-info text-center">No se encontraron registros con los filtros seleccionados.</div>`;
            return;
        }

        // =========================
        // MODO POR UNIDAD
        // =========================
        if (
            afecciones &&
            afecciones.length === 1 &&
            data.length &&
            data[0].causas?.[0]?.unidad !== undefined
        ) {
            data.forEach(item => {
                let html = `
                <div class="card mb-3 shadow-sm border-0">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="card-title fw-bold text-dark mb-0" style="font-size: 15px;">Año ${item.anio}</h5>
                            <span class="text-muted small">
                                Total unidad: <b>${Number(item.total_unidad ?? 0).toLocaleString('es-MX')}</b>
                            </span>
                        </div>
                        <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
                            <table class="table table-sm table-striped table-hover align-middle mb-0" style="font-size: 0.8rem;">
                                <thead class="table-dark sticky-top" style="z-index: 2;">
                                    <tr>
                                        <th style="width: 50px;">#</th>
                                        <th>Unidad</th>
                                        <th>Causa</th>
                                        <th style="width: 100px;" class="text-center">Total</th>
                                    </tr>
                                </thead>
                                <tbody>`;

                item.causas.forEach(c => {
                    html += `
                                    <tr>
                                        <td>${c.orden ?? ''}</td>
                                        <td>${c.unidad ?? ''}</td>
                                        <td>${c.causa ?? ''}</td>
                                        <td class="text-center fw-bold">${Number(c.total ?? 0).toLocaleString('es-MX')}</td>
                                    </tr>`;
                });

                html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;

                contenedor.insertAdjacentHTML("beforeend", html);
            });

            return;
        }

        // =========================
        // REPORTE NORMAL
        // =========================
        data.forEach(item => {
            let html = `
            <div class="card mb-3 shadow-sm border-0">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="card-title fw-bold text-dark mb-0" style="font-size: 15px;">Año ${item.anio}</h5>
                        <span class="text-muted small">
                            Total unidad: <b>${Number(item.total_unidad ?? 0).toLocaleString('es-MX')}</b>
                        </span>
                    </div>
                    <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
                        <table class="table table-sm table-striped table-hover align-middle mb-0" style="font-size: 0.8rem;">
                            <thead class="table-dark sticky-top" style="z-index: 2;">
                                <tr>
                                    <th style="width: 50px;">#</th>
                                    <th>Causa</th>
                                    <th style="width: 100px;" class="text-center">Total</th>
                                </tr>
                            </thead>
                            <tbody>`;

            item.causas.forEach(c => {
                html += `
                                <tr>
                                    <td>${c.orden || ''}</td>
                                    <td>${c.causa || ''}</td>
                                    <td class="text-center fw-bold">${Number(c.total || 0).toLocaleString('es-MX')}</td>
                                </tr>`;
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>`;

            contenedor.insertAdjacentHTML("beforeend", html);
        });
    }

    /* ==========================================
       4. DESCARGA A EXCEL
    ========================================== */
    const sufijoVar = typeof sufijo !== 'undefined' ? sufijo : 'Morb';
    const typeofVar = typeof tipo !== 'undefined' ? tipo : 'morbilidad';

    document.getElementById(`btnDescargar${sufijoVar}`)?.addEventListener("click", () => {
        const anios = Array.from(
            document.querySelectorAll(`.filtro-anio-${typeofVar}:checked, .filtro-anio:checked`)
        ).map(x => x.value);

        const meses = Array.from(
            document.querySelectorAll(`.filtro-mes-${typeofVar}:checked, .filtro-mes:checked`)
        ).map(x => x.value);

        const top = document.getElementById(`filtroTop${sufijoVar}`)?.value || "";
        const unidades = window.getUnidadesRepSeleccionadas ? window.getUnidadesRepSeleccionadas() : [];
        const afecciones = window.getAfeccionesSeleccionadas ? window.getAfeccionesSeleccionadas() : [];
        const servicios = window.getServiciosSeleccionados ? window.getServiciosSeleccionados() : [];

        const params = new URLSearchParams();

        if (anios.length) params.append("anios", anios.join(","));
        if (meses.length) params.append("meses", meses.join(","));
        unidades.forEach(x => params.append("unidades", x));
        afecciones.forEach(x => params.append("afecciones", x));
        if (top) params.append("top", top);
        if (servicios.length) params.append("servicios", servicios.join(","));

        window.location.href = `/reportes/${typeofVar}/excel?${params.toString()}`;
    });

    /* ==========================================
       5. LÓGICA Y EXPOSICIÓN GLOBAL DE RESETEO
    ========================================== */
    window.resetearVistaMorbilidadMortalidad = function () {
        console.log("🧹 Reseteando vista de Morbilidad / Mortalidad...");

        const currentTipo = typeof tipo !== 'undefined' ? tipo : 'morbilidad';
        const currentSufijo = typeof sufijo !== 'undefined' ? sufijo : 'Morb';

        // 1. Desmarcar checkboxes locales y del menú
        document.querySelectorAll(`
            .filtro-anio-${currentTipo}, .filtro-mes-${currentTipo},
            .filtro-anio, .filtro-mes,
            .menu-filtros input[type='checkbox'],
            .popover-unidades input[type='checkbox']
        `).forEach(chk => {
            chk.checked = false;
        });

        // 2. Resetear Select Top
        const selectTop = document.getElementById(`filtroTop${currentSufijo}`);
        if (selectTop) {
            selectTop.selectedIndex = 0;
        }

        // 3. Vaciar selecciones globales en memoria (unidades, servicios, afecciones)
        if (typeof unidadesSeleccionadas !== 'undefined') {
            if (typeof unidadesSeleccionadas.clear === 'function') unidadesSeleccionadas.clear();
            else unidadesSeleccionadas = [];
        }
        if (typeof afeccionesSeleccionadas !== 'undefined') afeccionesSeleccionadas = [];
        if (typeof serviciosSeleccionados !== 'undefined') serviciosSeleccionados = [];

        const btnUnidades = document.getElementById("btnUnidades");
        if (btnUnidades) btnUnidades.textContent = "🔍 Seleccionar unidades";

        // 4. Recargar datos limpios
        cargarDatos();
    };

    // Aliases globales para atrapar llamados directos
    window.resetearVistaMorbilidad = window.resetearVistaMorbilidadMortalidad;
    window.resetearVistaMortalidad = window.resetearVistaMorbilidadMortalidad;
    window.ejecutarFiltroMorbMort = cargarDatos;

    /* ==========================================
       6. LISTENERS GLOBALES Y INICIALIZACIÓN
    ========================================== */
    document.addEventListener("solicitarResetFiltros", window.resetearVistaMorbilidadMortalidad);
    document.addEventListener("limpiarFiltrosGlobales", window.resetearVistaMorbilidadMortalidad);
    document.addEventListener("aplicarFiltroUnidades", cargarDatos);

    // Carga inicial al montar el DOM
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", cargarDatos);
    } else {
        cargarDatos();
    }
</script>

{% endblock %}
